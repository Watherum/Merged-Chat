<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merged Chat — Twitch + YouTube</title>

<!-- Teko font from Google Fonts (OBS has internet access, so this loads fine) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- =======================================================================
     MERGED TWITCH + YOUTUBE CHAT OVERLAY
     One scrolling feed, messages interleaved, each tagged by platform.

     ---- QUICK START ------------------------------------------------------
     1. Edit the CONFIG block below:
          - TWITCH_CHANNEL : your twitch channel name (lowercase)
          - YT_VIDEO_ID    : the live video ID (the v=... part of the URL)
          - YT_API_KEY     : your YouTube Data API v3 key  (see HOW TO GET)
     2. Save the file.
     3. In OBS: add a Browser source -> tick "Local file" -> pick this file.
          Set width/height to your overlay size (e.g. 400 x 800).
     4. Right-click the source -> Refresh whenever you change config.

     ---- HOW TO GET A YOUTUBE API KEY (free, ~3 min) ----------------------
       a. Go to https://console.cloud.google.com/
       b. Create a project (top bar -> New Project) — any name.
       c. APIs & Services -> Library -> search "YouTube Data API v3"
          -> click it -> Enable.
       d. APIs & Services -> Credentials -> Create Credentials -> API key.
       e. Copy the key into YT_API_KEY below.
       IMPORTANT: under the key's settings, leave "Application restrictions"
       set to NONE. An "HTTP referrers" restriction will BLOCK requests from
       a file:// page (OBS) and the YouTube side will silently fail.

     ---- NOTES ------------------------------------------------------------
       * The YouTube stream must be LIVE for messages to come through.
       * Data API has a daily quota (10,000 units). Polling one chat is
         fine for normal stream lengths; very long streams may exhaust it.
       * Twitch needs nothing — it connects anonymously.
     ====================================================================== -->

<script>
/* ============================= CONFIG ============================= */
const CONFIG = {
  TWITCH_CHANNEL : "",        // <-- your twitch channel (lowercase)
  TWITCH_CHANNELS: [],        // <-- OPTIONAL extra channels to merge in,
                              //     e.g. ["second_channel", "third_channel"]
  YT_VIDEO_ID    : "",        // <-- the v=... id from the youtube URL
  YT_VIDEO_IDS   : [],        // <-- OPTIONAL extra live video IDs to merge in,
                              //     e.g. ["VIDEO_ID_2", "VIDEO_ID_3"].
                              //     NOTE: each one uses more API quota.
  YT_API_KEY     : "",        // <-- paste your YouTube Data API key here

  // OPTIONAL second YouTube API key (from a SEPARATE Google Cloud project),
  // used ONLY when the page is opened with ?docked=true. This lets an OBS dock
  // poll on its own 10,000/day quota instead of sharing the stream source's.
  // Leave blank to just reuse YT_API_KEY. (Independent of ?bg=dark.)
  YT_API_KEY_DOCK : "",

  // How often to poll each YouTube chat. 0 = as fast as the API allows
  // (default, lowest latency). Raise it to slow polling and save quota,
  // e.g. 15000 = poll every 15s. A 2s hard floor always applies.
  YT_MIN_POLL_MS : 0,

  // YouTube custom / membership emotes: ":shortcode:" -> image URL. YouTube's API
  // only sends the shortcode text (no image), so map them here to render images.
  // HOW TO FILL THIS:
  //   - SHORTCODE: the text form shown in chat, e.g. ":_happy:" (keep the colons).
  //     Tip: open this overlay's console (F12) — any unmapped shortcode that comes
  //     through live chat is logged, so you can copy the exact text.
  //   - URL: right-click the emote in your YouTube live chat -> "Copy image address".
  YT_EMOTES : {
    // Map your channel's member emotes here: ":shortcode:" -> image URL. Right-click
    // an emote in your YouTube live chat -> "Copy image address" for the URL; confirm
    // the exact shortcode in the F12 console (it logs any unmapped ones). Example:
    // ":_happy:" : "https://yt3.googleusercontent.com/XXXX=s48-c-k-nd",
  },

  MAX_MESSAGES   : 80,    // how many messages to keep on screen (overlay mode)
  DOCK_RETAIN_ALL : true, // in ?docked=true mode, keep a long scroll-back history
                          // (DOCK_MAX_MESSAGES instead of MAX_MESSAGES) and disable
                          // fade-out. Override per-URL with &retain=0 / &retain=false.
  DOCK_MAX_MESSAGES : 400,// how many messages to keep in docked mode (the scroll-back
                          // buffer) — plenty for a full stream without growing forever.
  SHOW_BACKLOG   : false, // false = only show NEW messages after load (recommended)
  SHOW_STATUS    : true,  // show the small connection status line (top-left)
  STATUS_HIDE_SEC : 12,   // seconds before the status box auto-hides (0 = never hide)
  FONT_SIZE_PX   : 18,    // base text size

  FADE_OUT       : true,  // true = old messages fade out and disappear after a while
  MESSAGE_LIFE_SEC : 30,  // seconds a message stays before it starts fading (FADE_OUT only)
  FADE_DURATION_SEC: 1,   // how long the fade-out animation takes

  DEMO_MODE      : false, // true = show fake test messages (no stream/keys needed).
                          // Set back to false before going live!

  // Dock background: the stream Browser SOURCE stays transparent (true alpha).
  // To get a dark background in an OBS *docked* view, add ?bg=dark to the URL,
  // e.g.  file:///D:/.../merged-chat.html?bg=dark   (or end the URL with #dark).
  // DARK_BG_COLOR sets the shade used when ?bg=dark is present.
  DARK_BG_COLOR  : "#2a2a2e",
};
/* ================================================================= */
</script>

<style>
  :root { --fs: 18px; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;          /* transparent for OBS overlay */
    overflow: hidden;
    /* Default font. To use Teko instead, add "Teko", at the front:
       font-family: "Teko", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
       (Teko is condensed/smaller, so bump FONT_SIZE_PX up to ~24 if you do) */
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Feed grows from the bottom, like a real chat */
  #feed {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    padding: 10px;
    box-sizing: border-box;
    max-height: 100%;
  }

  .msg {
    font-size: var(--fs);
    line-height: 1.35;
    color: #fff;
    /* Strong outline so text stays readable over any video */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px  1px 0 #000, 1px  1px 0 #000,
       0    0   4px #000;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    animation: pop 0.18s ease-out;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* applied to old messages when FADE_OUT is on; duration set from JS */
  .msg.fade-out {
    opacity: 0;
    transition: opacity var(--fade-dur, 1s) ease-out;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7em;
    font-weight: 700;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 4px;
    margin-right: 6px;
    vertical-align: middle;
    color: #fff;
    text-shadow: none;
  }
  .badge.yt { background: #ff0033; }
  .badge.tw { background: #9147ff; }
  .badge svg {
    width: 1.05em;
    height: 1.05em;
    display: block;
    fill: currentColor;   /* white glyph */
  }

  .name {
    font-weight: 700;
    margin-right: 2px;
  }
  .name::after { content: ":"; color: #fff; }

  .text { color: #fff; }

  .emote {
    height: 1.4em;
    vertical-align: middle;
    margin: 0 1px;
  }

  /* small mod / owner marker */
  .tag {
    display: inline-block;
    font-size: 0.62em;
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
    text-shadow: none;
    color: #fff;
  }
  .tag.owner  { background: #e8a200; }
  .tag.mod    { background: #00a152; }
  .tag.vip    { background: #e005b9; }
  .tag.sub    { background: #e02d2d; gap: 2px; }  /* Twitch subscriber */
  .tag.member { background: #e02d2d; }            /* YouTube member */
  .tag .mo    { font-size: 0.85em; font-weight: 700; line-height: 1; }
  .tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tag svg {
    width: 1.2em;
    height: 1.2em;
    display: block;
    fill: currentColor;   /* white glyph */
  }
  /* Make the moderator sword bigger and give it a dark edge so it pops on green */
  .tag.mod svg {
    width: 1.45em;
    height: 1.45em;
    filter: drop-shadow(0 0 0.5px rgba(0,0,0,.55));
  }

  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 12px;
    font-family: monospace;
    line-height: 1.6;
    color: #ddd;
    background: rgba(0,0,0,0.55);
    padding: 6px 10px;
    border-radius: 4px;
    max-width: 90%;
    transition: opacity 0.6s;
    z-index: 10;
  }
  #status.hidden { opacity: 0; }

  /* Docked mode (?docked=true): let the page scroll so you can scroll up through
     history. The feed flows in normal document flow and the document scrolls;
     when messages are sparse they still anchor to the bottom via min-height. */
  body.docked { overflow-y: auto; overflow-x: hidden; }
  body.docked #feed {
    position: static;
    min-height: 100%;
    max-height: none;
  }
  body.docked #status { position: fixed; }   /* keep status pinned while scrolling */
</style>
</head>

<body>
  <div id="status">starting…</div>
  <div id="feed"></div>

<script>
/* ----------------------------- setup ----------------------------- */
document.documentElement.style.setProperty("--fs", CONFIG.FONT_SIZE_PX + "px");
document.documentElement.style.setProperty("--fade-dur", CONFIG.FADE_DURATION_SEC + "s");

// Dark background for OBS docks: opt-in via ?bg=dark (or #dark) in the URL.
// Stream Browser sources omit this, so they keep a transparent (alpha) background.
(function applyBackground() {
  const wantsDark = /(\?|&)bg=dark\b/.test(location.search) || location.hash === "#dark";
  if (wantsDark) {
    document.documentElement.style.background = CONFIG.DARK_BG_COLOR;
    document.body.style.background = CONFIG.DARK_BG_COLOR;
  }
})();

// Docked mode: opt-in via ?docked=true (or #docked) in the URL. When on, YouTube
// uses YT_API_KEY_DOCK (if set) so a dock can draw from a separate API quota than
// the on-stream source. Fully independent of the ?bg=dark background option.
const IS_DOCKED = /(\?|&)docked=(true|1)\b/i.test(location.search) || location.hash === "#docked";
const YT_KEY = (IS_DOCKED && CONFIG.YT_API_KEY_DOCK) ? CONFIG.YT_API_KEY_DOCK : CONFIG.YT_API_KEY;
if (IS_DOCKED) {
  console.log("[merged-chat] docked mode:",
    CONFIG.YT_API_KEY_DOCK ? "using dock YouTube key (separate quota)" : "no dock key set — falling back to YT_API_KEY");
}

// Docked retain-all: keep the full message history and let the page scroll.
// On by default in docked mode; disable per-URL with &retain=0 / &retain=false.
const DOCK_RETAIN = IS_DOCKED && CONFIG.DOCK_RETAIN_ALL
  && !/(\?|&)retain=(false|0)\b/i.test(location.search);
if (IS_DOCKED) document.body.classList.add("docked");

// In docked retain mode the document itself scrolls; keep it pinned to the
// newest message unless the user has scrolled up to read history.
const docScroller = document.scrollingElement || document.documentElement;
function isPinnedToBottom() {
  return docScroller.scrollHeight - docScroller.scrollTop - docScroller.clientHeight < 40;
}

const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
if (!CONFIG.SHOW_STATUS) statusEl.style.display = "none";

// One status line per source (twitch / youtube / demo), each on its own row.
const statusLines = {};
let statusTimer = null;
function status(key, msg) {
  console.log("[merged-chat]", key + ":", msg);
  statusLines[key] = msg;
  if (!CONFIG.SHOW_STATUS) return;
  statusEl.innerHTML = Object.values(statusLines)
    .filter(Boolean)
    .map(escapeHtml)
    .join("<br>");
  statusEl.classList.remove("hidden");
  clearTimeout(statusTimer);
  if (CONFIG.STATUS_HIDE_SEC > 0) {
    statusTimer = setTimeout(() => statusEl.classList.add("hidden"), CONFIG.STATUS_HIDE_SEC * 1000);
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// stable per-name color when the platform doesn't give us one
function colorFor(name) {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 70%, 66%)`;
}

// Platform logos as inline SVGs (no external image needed)
const TWITCH_ICON =
  `<svg viewBox="0 0 24 24" aria-label="Twitch"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>`;
const YOUTUBE_ICON =
  `<svg viewBox="0 0 24 24" aria-label="YouTube"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
// Video-camera icon used for the broadcaster tag
const CAMERA_ICON =
  `<svg viewBox="0 0 24 24" aria-label="Broadcaster"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>`;
// Shield-with-check icon used for the moderator tag
const MOD_ICON =
  `<svg viewBox="0 0 24 24" aria-label="Moderator"><path fill-rule="evenodd" d="M12 2.5 19.5 5 19.5 11.5 C19.5 16 16 19.5 12 21.5 C8 19.5 4.5 16 4.5 11.5 L4.5 5Z M10.9 16 7.2 12.3 8.7 10.8 10.9 13 15.3 8.6 16.8 10.1Z"/></svg>`;
// Gem icon used for the VIP tag
const VIP_ICON =
  `<svg viewBox="0 0 24 24" aria-label="VIP"><path d="M6 3h12l4 6-10 12L2 9zm.84 2L4.3 8.5h4.2zm10.32 0L15.5 8.5h4.2zM12 5.4 9.7 8.5h4.6zM4.9 10.5l5.1 6.7-2.8-6.7zm6.2 0L12 17l.9-6.5zm4.9 0-2.3 6.7 5.1-6.7z"/></svg>`;
// Star icon shared by Twitch subscribers and YouTube members
const STAR_ICON =
  `<svg viewBox="0 0 24 24" aria-label="Subscriber"><path d="M12 3 14.116 9.088 20.56 9.219 15.424 13.112 17.29 19.281 12 15.6 6.71 19.281 8.576 13.112 3.44 9.219 9.884 9.088Z"/></svg>`;

function addMessage({ platform, name, color, html, owner, mod, vip, sub, subMonths, member }) {
  const row = document.createElement("div");
  row.className = "msg " + platform;

  let tagHtml = "";
  if (owner) tagHtml += `<span class="tag owner">${CAMERA_ICON}</span>`;
  else if (mod) tagHtml += `<span class="tag mod">${MOD_ICON}</span>`;
  else if (vip) tagHtml += `<span class="tag vip">${VIP_ICON}</span>`;
  else if (sub) tagHtml += `<span class="tag sub">${STAR_ICON}${subMonths ? `<span class="mo">${subMonths}</span>` : ""}</span>`;
  else if (member) tagHtml += `<span class="tag member">${STAR_ICON}</span>`;

  const badgeInner = platform === "yt" ? YOUTUBE_ICON : TWITCH_ICON;

  row.innerHTML =
    `<span class="badge ${platform}">${badgeInner}</span>` +
    tagHtml +
    `<span class="name" style="color:${color}">${escapeHtml(name)}</span> ` +
    `<span class="text">${html}</span>`;

  // In docked retain mode, remember whether we were at the bottom BEFORE adding
  // this row so we can decide whether to keep following the newest message.
  const wasPinned = DOCK_RETAIN ? isPinnedToBottom() : true;
  const cap = DOCK_RETAIN ? CONFIG.DOCK_MAX_MESSAGES : CONFIG.MAX_MESSAGES;

  feed.appendChild(row);

  // Trim to the cap. In docked mode only trim while the user is pinned to the
  // bottom, so the view doesn't jump when they've scrolled up reading history;
  // the buffer trims back down once they scroll back to the bottom.
  if (wasPinned) {
    while (feed.children.length > cap) {
      feed.removeChild(feed.firstChild);
    }
  }

  // Follow the newest message only if the user hadn't scrolled up.
  if (DOCK_RETAIN && wasPinned) docScroller.scrollTop = docScroller.scrollHeight;

  // Optional: fade out and remove this message after it has lived its lifetime.
  // Skipped in docked retain mode so history stays intact for scrolling back.
  if (CONFIG.FADE_OUT && !DOCK_RETAIN) {
    setTimeout(() => {
      row.classList.add("fade-out");
      setTimeout(() => row.remove(), CONFIG.FADE_DURATION_SEC * 1000);
    }, CONFIG.MESSAGE_LIFE_SEC * 1000);
  }
}

/* ============================= TWITCH ============================= */
/* Anonymous IRC over WebSocket — no key, no account needed.         */
function parseIRC(line) {
  let tags = {}, rest = line;
  if (rest[0] === "@") {
    const sp = rest.indexOf(" ");
    for (const part of rest.slice(1, sp).split(";")) {
      const eq = part.indexOf("=");
      tags[part.slice(0, eq)] = part.slice(eq + 1);
    }
    rest = rest.slice(sp + 1);
  }
  let prefix = "";
  if (rest[0] === ":") {
    const sp = rest.indexOf(" ");
    prefix = rest.slice(1, sp);
    rest = rest.slice(sp + 1);
  }
  const sp = rest.indexOf(" ");
  const command = sp === -1 ? rest : rest.slice(0, sp);
  let params = sp === -1 ? "" : rest.slice(sp + 1);

  let middle = params, text = "";
  if (params.startsWith(":")) { text = params.slice(1); middle = ""; }
  else {
    const ci = params.indexOf(" :");
    if (ci !== -1) { text = params.slice(ci + 2); middle = params.slice(0, ci); }
  }
  return { tags, prefix, command, middle, text };
}

// Replace Twitch emote ranges (from IRC tags) with emote images.
function renderTwitch(text, emotesTag) {
  const chars = Array.from(text); // code-point aware (Twitch indexes by code point)
  if (!emotesTag) return escapeHtml(text);

  const reps = [];
  for (const group of emotesTag.split("/")) {
    if (!group) continue;
    const [id, positions] = group.split(":");
    for (const pos of positions.split(",")) {
      const [s, e] = pos.split("-").map(Number);
      reps.push({ start: s, end: e, id });
    }
  }
  reps.sort((a, b) => a.start - b.start);

  let out = "", idx = 0;
  for (const r of reps) {
    out += escapeHtml(chars.slice(idx, r.start).join(""));
    const name = chars.slice(r.start, r.end + 1).join("");
    out += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0" alt="${escapeHtml(name)}" title="${escapeHtml(name)}">`;
    idx = r.end + 1;
  }
  out += escapeHtml(chars.slice(idx).join(""));
  return out;
}

// YouTube only sends emotes as :shortcode: text (no image data), so we map known
// shortcodes to image URLs ourselves (see CONFIG.YT_EMOTES). Any shortcode we DON'T
// have a URL for is logged once to the console (F12) to make filling the map easy.
const _ytSeenShortcodes = new Set();
const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function renderYouTube(text) {
  const map = CONFIG.YT_EMOTES || {};
  for (const m of text.matchAll(/:_?[\w+-]{2,}:/g)) {
    if (!map[m[0]] && !_ytSeenShortcodes.has(m[0])) {
      _ytSeenShortcodes.add(m[0]);
      console.log("[merged-chat] unmapped YouTube emote shortcode:", m[0]);
    }
  }
  const codes = Object.keys(map).sort((a, b) => b.length - a.length); // longest first
  if (!codes.length) return escapeHtml(text);

  const re = new RegExp(codes.map(escapeRegex).join("|"), "g");
  let out = "", last = 0, m;
  while ((m = re.exec(text)) !== null) {
    out += escapeHtml(text.slice(last, m.index));
    const code = m[0];
    out += `<img class="emote" src="${map[code]}" alt="${escapeHtml(code)}" title="${escapeHtml(code)}">`;
    last = m.index + code.length;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

// Collect every channel to join from TWITCH_CHANNEL + TWITCH_CHANNELS,
// normalized (lowercase, no leading '#', trimmed) and de-duplicated.
function twitchChannels() {
  const raw = [];
  if (CONFIG.TWITCH_CHANNEL) raw.push(CONFIG.TWITCH_CHANNEL);
  if (Array.isArray(CONFIG.TWITCH_CHANNELS)) raw.push(...CONFIG.TWITCH_CHANNELS);

  const seen = new Set(), out = [];
  for (const c of raw) {
    const name = String(c).trim().toLowerCase().replace(/^#/, "");
    if (name && !seen.has(name)) { seen.add(name); out.push(name); }
  }
  return out;
}

function connectTwitch() {
  const channels = twitchChannels();
  if (!channels.length) { status("twitch", "Twitch: no channel set"); return; }
  const label = channels.map(c => "#" + c).join(" ");
  status("twitch", "Twitch: connecting to " + label + "…");
  const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    ws.send("NICK justinfan" + Math.floor(Math.random() * 100000)); // anonymous
    for (const c of channels) ws.send("JOIN #" + c);               // one socket, many channels
    status("twitch", "Twitch: connected to " + label);
  };

  ws.onmessage = (ev) => {
    for (const line of ev.data.split("\r\n")) {
      if (!line) continue;
      if (line.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); continue; }

      const m = parseIRC(line);
      if (m.command !== "PRIVMSG") continue;

      const nick = m.prefix.split("!")[0];
      const name = m.tags["display-name"] || nick;
      const color = m.tags["color"] || colorFor(name);
      const badges = m.tags["badges"] || "";
      const badgeInfo = m.tags["badge-info"] || "";
      const isSub = badges.includes("subscriber") || badges.includes("founder");
      // Exact cumulative months live in badge-info; fall back to the badges tier.
      const subMatch = isSub
        ? (/(?:subscriber|founder)\/(\d+)/.exec(badgeInfo) ||
           /(?:subscriber|founder)\/(\d+)/.exec(badges))
        : null;

      addMessage({
        platform: "tw",
        name,
        color,
        html: renderTwitch(m.text, m.tags["emotes"]),
        owner: badges.includes("broadcaster"),
        mod: badges.includes("moderator"),
        vip: badges.includes("vip"),
        sub: isSub,
        subMonths: subMatch ? subMatch[1] : "",
      });
    }
  };

  ws.onclose = () => {
    status("twitch", "Twitch: disconnected, reconnecting in 3s…");
    setTimeout(connectTwitch, 3000);
  };
  ws.onerror = () => ws.close();
}

/* ============================= YOUTUBE ============================ */
/* YouTube Data API v3 — needs an API key (see header comment).      */
/* NOTE: each YouTube chat polled here uses your daily API quota, so  */
/* merging several at once burns it proportionally faster.            */

// Collect every video ID from YT_VIDEO_ID + YT_VIDEO_IDS, trimmed & de-duped.
function youtubeVideoIds() {
  const raw = [];
  if (CONFIG.YT_VIDEO_ID) raw.push(CONFIG.YT_VIDEO_ID);
  if (Array.isArray(CONFIG.YT_VIDEO_IDS)) raw.push(...CONFIG.YT_VIDEO_IDS);

  const seen = new Set(), out = [];
  for (const v of raw) {
    const id = String(v).trim();
    if (id && !seen.has(id)) { seen.add(id); out.push(id); }
  }
  return out;
}

function startYouTube() {
  if (!YT_KEY) { status("youtube", "YouTube: no API key set (Twitch only)"); return; }
  const ids = youtubeVideoIds();
  if (!ids.length) { status("youtube", "YouTube: no video ID set"); return; }

  // One independent connect + poll loop per video, each with its own status line.
  ids.forEach((id, i) => {
    const statusKey = ids.length > 1 ? "youtube" + (i + 1) : "youtube";
    startYouTubeVideo(id, statusKey);
  });
}

async function startYouTubeVideo(videoId, statusKey) {
  status(statusKey, "YouTube: connecting…");
  try {
    const r = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${videoId}&key=${YT_KEY}`
    );
    const d = await r.json();
    if (d.error) { status(statusKey, "YouTube: " + (d.error.message || "API error")); return; }

    const item = d.items?.[0];
    const chatId = item?.liveStreamingDetails?.activeLiveChatId;
    if (!chatId) { status(statusKey, "YouTube: no active live chat (is the stream live?)"); return; }

    const channel = item?.snippet?.channelTitle || "channel";
    status(statusKey, "YouTube: connected to " + channel);
    pollYouTube(chatId, "", true, statusKey);
  } catch (e) {
    status(statusKey, "YouTube error: " + e.message);
  }
}

async function pollYouTube(chatId, pageToken, first, statusKey) {
  try {
    const url =
      `https://www.googleapis.com/youtube/v3/liveChat/messages` +
      `?liveChatId=${chatId}&part=snippet,authorDetails&key=${YT_KEY}` +
      (pageToken ? `&pageToken=${pageToken}` : "");

    const r = await fetch(url);
    const d = await r.json();
    if (d.error) { status(statusKey, "YouTube API: " + (d.error.message || "error")); return; }

    // Skip the initial backlog so we start clean (unless SHOW_BACKLOG is on)
    if (!(first && !CONFIG.SHOW_BACKLOG)) {
      for (const it of d.items || []) {
        const a = it.authorDetails;
        addMessage({
          platform: "yt",
          name: a.displayName,
          color: colorFor(a.displayName),
          html: renderYouTube(it.snippet.displayMessage || ""),
          owner: a.isChatOwner,
          mod: a.isChatModerator,
          member: a.isChatSponsor,
        });
      }
    }

    // Respect the API's suggested interval, but never faster than 2s, and never
    // faster than YT_MIN_POLL_MS if the user set one (to save quota).
    const floor = Math.max(CONFIG.YT_MIN_POLL_MS || 0, 2000);
    const wait = Math.max(d.pollingIntervalMillis || 5000, floor);
    setTimeout(() => pollYouTube(chatId, d.nextPageToken, false, statusKey), wait);
  } catch (e) {
    status(statusKey, "YouTube poll error: " + e.message);
    setTimeout(() => pollYouTube(chatId, pageToken, first, statusKey), 5000);
  }
}

                 "wait what just happened, looked away for two seconds and chat is going crazy 💀💀",
                 "stream looks so crisp today, did you change something with the setup? 👀"];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  // Demo emotes. Globals (render anywhere) are the always-available fallback; the
  // configured channel's REAL emotes are fetched below and merged in, so the demo
  // automatically reflects whatever channel this file is set up for.
  const EMOTES = {
    Kappa: "25", LUL: "425618", PogChamp: "305954156", Kreygasm: "41",
    "4Head": "354", "<3": "9", SeemsGood: "64138", NotLikeThis: "58765",
  };
  // Pull a channel's emotes (name -> id) from ivr.fi — public, no auth, CORS-open.
  async function fetchChannelEmotes(login) {
    if (!login) return;
    try {
      const r = await fetch(`https://api.ivr.fi/v2/twitch/emotes/channel/${encodeURIComponent(login)}`);
      if (!r.ok) return;
      const d = await r.json();
      for (const sp of d.subProducts || [])
        for (const e of sp.emotes || [])
          if (e.code && e.id) EMOTES[e.code] = e.id;
    } catch (_) { /* offline / CORS / no emotes: just use the globals */ }
  }
  const channels = [CONFIG.TWITCH_CHANNEL, ...(CONFIG.TWITCH_CHANNELS || [])].filter(Boolean);
  await Promise.all(channels.map(fetchChannelEmotes));
  const emoteNames = Object.keys(EMOTES);

  const emoteUrl = (id) => `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0`;
  // Swap known emote words for their Twitch images; escape everything else.
  const demoRender = (text) => text.split(" ").map((w) =>
    EMOTES[w]
      ? `<img class="emote" src="${emoteUrl(EMOTES[w])}" alt="${w}">`
      : escapeHtml(w)
  ).join(" ");
  // Randomly sprinkle a few emotes onto a message (used for Twitch demo rows).
  const withEmotes = (text) => {
    if (!emoteNames.length || Math.random() > 0.45) return text;
    const n = 1 + Math.floor(Math.random() * 3);
    const e = Array.from({ length: n }, () => pick(emoteNames)).join(" ");
    return Math.random() < 0.5 ? `${text} ${e}` : `${e} ${text}`;
  };
  // YouTube demo emotes: the :shortcodes: from CONFIG.YT_EMOTES (rendered as images
  // by renderYouTube). Populate YT_EMOTES to see your member emotes in the demo.
  const ytEmoteCodes = Object.keys(CONFIG.YT_EMOTES || {});
  const withYtEmotes = (text) => {
    if (!ytEmoteCodes.length || Math.random() > 0.45) return text;
    const n = 1 + Math.floor(Math.random() * 3);
    const e = Array.from({ length: n }, () => pick(ytEmoteCodes)).join(" ");
    return Math.random() < 0.5 ? `${text} ${e}` : `${e} ${text}`;
  };

  setInterval(() => {
    const platform = Math.random() < 0.5 ? "yt" : "tw";
    const yt = platform === "yt";
    const name = pick(names);
    const roll = Math.random();
    addMessage({
      platform,
      name,
      color: colorFor(name),
      html: yt
        ? renderYouTube(withYtEmotes(pick(lines)))
        : demoRender(withEmotes(pick(lines))),
      owner: roll > 0.95,                          // ~5% broadcaster
      mod: roll > 0.85 && roll <= 0.95,            // ~10% mod
      vip: !yt && roll > 0.78 && roll <= 0.85,     // Twitch VIP
      sub: !yt && roll > 0.55 && roll <= 0.78,     // Twitch subscriber
      subMonths: pick(["1", "6", "12", "24"]),
      member: yt && roll > 0.55 && roll <= 0.85,   // YouTube member
    });
  }, 1200);

  status("demo", "DEMO MODE — showing fake messages (set DEMO_MODE:false to go live)");
}

/* ============================== GO =============================== */
if (CONFIG.DEMO_MODE) {
  startDemo();
} else {
  connectTwitch();
  startYouTube();
}
