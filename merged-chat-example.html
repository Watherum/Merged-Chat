<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merged Chat — Twitch + YouTube</title>

<!-- Teko font from Google Fonts (OBS has internet access, so this loads fine) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- =======================================================================
     MERGED TWITCH + YOUTUBE CHAT OVERLAY
     One scrolling feed, messages interleaved, each tagged by platform.

     ---- QUICK START ------------------------------------------------------
     1. Edit the CONFIG block below:
          - TWITCH_CHANNEL : your twitch channel name (lowercase)
          - YT_VIDEO_ID    : the live video ID (the v=... part of the URL)
          - YT_API_KEY     : your YouTube Data API v3 key  (see HOW TO GET)
     2. Save the file.
     3. In OBS: add a Browser source -> tick "Local file" -> pick this file.
          Set width/height to your overlay size (e.g. 400 x 800).
     4. Right-click the source -> Refresh whenever you change config.

     ---- HOW TO GET A YOUTUBE API KEY (free, ~3 min) ----------------------
       a. Go to https://console.cloud.google.com/
       b. Create a project (top bar -> New Project) — any name.
       c. APIs & Services -> Library -> search "YouTube Data API v3"
          -> click it -> Enable.
       d. APIs & Services -> Credentials -> Create Credentials -> API key.
       e. Copy the key into YT_API_KEY below.
       IMPORTANT: under the key's settings, leave "Application restrictions"
       set to NONE. An "HTTP referrers" restriction will BLOCK requests from
       a file:// page (OBS) and the YouTube side will silently fail.

     ---- NOTES ------------------------------------------------------------
       * The YouTube stream must be LIVE for messages to come through.
       * Data API has a daily quota (10,000 units). Polling one chat is
         fine for normal stream lengths; very long streams may exhaust it.
       * Twitch chat needs nothing — it connects anonymously.
       * Channel point redeems DO need a one-time token setup — see below.

     ---- HOW TO SHOW TWITCH ALERTS & CHANNEL POINT REDEEMS (optional) -----
       Channel points, subs, resubs, gift subs, cheers, follows, raids and
       hype trains don't come over chat, so this uses Twitch EventSub with a
       token for YOUR broadcaster account. It AUTO-REFRESHES, so once set up
       it won't expire mid-stream. You only see events for the channel that
       owns the token. The ?setup flow grants every scope these need, so if
       you already set up redeems, just run ?setup once more. One-time setup:
         1. Register an app at https://dev.twitch.tv/console/apps -> Register.
              - OAuth Redirect URL: exactly  http://localhost
              - Category: anything.
            Copy the Client ID, and click "New Secret" to make a Client Secret.
         2. Put both into TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET below; save.
         3. Open this file in a normal browser with ?setup on the end, e.g.
              file:///D:/.../merged-chat.html?setup
            Follow the two on-screen steps; it hands you a REFRESH TOKEN.
         4. Paste that into TWITCH_REFRESH_TOKEN below, save, refresh the OBS
            source. That's it — it keeps itself authorized from now on.
       (Your Client Secret + refresh token live only in this local file, which
        is gitignored, so they aren't shared — same as the API keys above.)
     ====================================================================== -->

<script>
/* ============================= CONFIG =============================
   FALLBACK DEFAULTS ONLY.

   When relay.py is running — the normal setup — it sends these settings from
   app.properties as soon as a page connects, and they replace whatever is
   here. app.properties is the one file to edit.

   What's below is what a page uses when NO relay is running: appearance
   defaults, plus connection details so the overlay still works standalone.
   RELAY_URL / RELAY_PORT_TRIES are the exception — they're how a page finds
   the relay in the first place, so they can only live here.
   ================================================================= */
const CONFIG = {
  TWITCH_CHANNEL : "",        // <-- your twitch channel (lowercase)
  TWITCH_CHANNELS: [],        // <-- OPTIONAL extra channels to merge in,
                              //     e.g. ["second_channel", "third_channel"]
  HEAD_MODS      : [],        // <-- OPTIONAL Twitch usernames (lowercase) to mark as
                              //     "head mod": they show a war-hammer icon instead of
                              //     the normal mod sword. e.g. ["mod_one", "mod_two"].
                              //     Only applies to users who are already moderators.
  YT_VIDEO_ID    : "",        // <-- the v=... id from the youtube URL
  YT_VIDEO_IDS   : [],        // <-- OPTIONAL extra live video IDs to merge in,
                              //     e.g. ["VIDEO_ID_2", "VIDEO_ID_3"].
                              //     NOTE: each one uses more API quota.
  YT_API_KEY     : "",        // <-- paste your YouTube Data API key here

  // OPTIONAL backup YouTube API key(s), from SEPARATE Google Cloud projects
  // (quota is per project, so each one brings its own 10,000/day). When the
  // primary key runs out of quota mid-stream, polling switches to the next key
  // instead of stopping for the day. Give one key or a list:
  //   YT_API_KEY_BACKUP : "AIza...SECOND",
  //   YT_API_KEY_BACKUP : ["AIza...SECOND", "AIza...THIRD"],
  // Leave blank for no backup.
  YT_API_KEY_BACKUP : "",

  // How often to poll each YouTube chat, in milliseconds. Each poll costs 5
  // quota units, so 10,000/day = 2,000 polls total across every YouTube source
  // on this key. 15000 (every 15s) = ~1,200 units/hr per chat, about 8 hours of
  // stream. Lower it for snappier chat at the cost of runtime: 0 polls as fast
  // as the API allows (~5s) and burns the whole quota in under 3 hours.
  // Polling slower never loses messages — each poll returns everything since
  // the last one — it just delays them. A 2s hard floor always applies.
  YT_MIN_POLL_MS : 15000,

  // Safety net for a failing YouTube connection. A dead stream, an expired key
  // or a dropped network used to retry every 5s forever in the background; now
  // retries back off exponentially and stop after this many consecutive
  // failures (0 = never give up). Fatal errors — quota gone, bad key, chat
  // ended — stop immediately regardless, since retrying can't fix them.
  YT_MAX_RETRIES    : 6,
  YT_BACKOFF_MAX_MS : 300000,   // ceiling on the backoff between retries (5 min)

  // YouTube custom / membership emotes: ":shortcode:" -> image URL. YouTube's API
  // only sends the shortcode text (no image), so map them here to render images.
  // HOW TO FILL THIS:
  //   - SHORTCODE: the text form shown in chat, e.g. ":_happy:" (keep the colons).
  //     Tip: open this overlay's console (F12) — any unmapped shortcode that comes
  //     through live chat is logged, so you can copy the exact text.
  //   - URL: right-click the emote in your YouTube live chat -> "Copy image address".
  YT_EMOTES : {
    // Map your channel's member emotes here: ":shortcode:" -> image URL. Right-click
    // an emote in your YouTube live chat -> "Copy image address" for the URL; confirm
    // the exact shortcode in the F12 console (it logs any unmapped ones). Example:
    // ":_happy:" : "https://yt3.googleusercontent.com/XXXX=s48-c-k-nd",
  },

  // ---- Twitch alerts & channel point redeems (optional) — see header ----
  // Shows channel points AND subs / resubs / gift subs / cheers / follows /
  // raids / hype trains in the feed. Uses Twitch EventSub with a broadcaster
  // token that AUTO-REFRESHES (won't die mid-stream). Get it once via ?setup.
  // Only the channel that owns the token is read. Adding alerts needs extra
  // scopes, so if you set up redeems earlier, run ?setup once more to re-grant.
  SHOW_REDEEMS        : true, // false = ignore channel points entirely
  SHOW_ALERTS         : {     // Twitch alerts to show (needs one re-?setup for scopes)
    follows   : true,
    subs      : true,         // new subs + resubs (with message)
    giftSubs  : true,
    cheers    : true,         // bits
    raids     : true,
    hypeTrain : true,
  },
  TWITCH_CLIENT_ID    : "",   // Twitch app Client ID (dev.twitch.tv/console/apps)
  TWITCH_CLIENT_SECRET: "",   // Twitch app Client Secret (stays in this local file)
  TWITCH_REFRESH_TOKEN: "",   // long-lived refresh token from the ?setup flow

  // OPTIONAL second Twitch app, used ONLY when the page is opened with
  // ?docked=true. Twitch rejects a duplicate EventSub subscription (same app +
  // event type + channel) with 409, so an OBS dock sharing the app above gets
  // "Alerts: nothing subscribed" while the stream source keeps them. Registering
  // a SECOND app at dev.twitch.tv/console/apps (Redirect URL http://localhost)
  // gives the dock its own subscriptions. Setup:
  //   1. paste the new app's Client ID + Secret below,
  //   2. open this file with ?setup&docked=true and run the two steps,
  //   3. paste the token it prints into TWITCH_REFRESH_TOKEN_DOCK.
  // Leave all three blank to just reuse the app above (alerts then work in
  // whichever page connects first). NOTE: when relay.py is running it holds the
  // ONE EventSub session and feeds every page, so these are not needed at all.
  // Independent of ?bg=dark.
  TWITCH_CLIENT_ID_DOCK    : "",
  TWITCH_CLIENT_SECRET_DOCK: "",
  TWITCH_REFRESH_TOKEN_DOCK: "",

  // --- appearance: overridden by app.properties when the relay is running ---
  MAX_MESSAGES   : 80,    // how many messages to keep on screen (overlay mode)
  DOCK_RETAIN_ALL : true, // in ?docked=true mode, keep a long scroll-back history
                          // (DOCK_MAX_MESSAGES instead of MAX_MESSAGES) and disable
                          // fade-out. Override per-URL with &retain=0 / &retain=false.
  DOCK_MAX_MESSAGES : 400,// how many messages to keep in docked mode (the scroll-back
                          // buffer) — plenty for a full stream without growing forever.
  SHOW_BACKLOG   : false, // false = only show NEW messages after load (recommended).
                          // YouTube-only: Twitch IRC sends no history on connect,
                          // so Twitch is always live-from-join regardless of this.
  SHOW_DELETED   : false, // what to do when a moderator deletes a message (or times
                          // out / bans its author). false = take the message off the
                          // feed entirely; true = keep the row and replace its text
                          // with "message deleted", which is often what you want in
                          // an OBS dock where you're watching moderation happen.
  SHOW_STATUS    : true,  // show the small connection status line (top-left)
  STATUS_HIDE_SEC : 12,   // seconds before the status box auto-hides (0 = never hide)
  FONT_SIZE_PX   : 18,    // base text size

  FADE_OUT       : true,  // true = old messages fade out and disappear after a while
  MESSAGE_LIFE_SEC : 30,  // seconds a message stays before it starts fading (FADE_OUT only)
  FADE_DURATION_SEC: 1,   // how long the fade-out animation takes

  RELAY_URL      : "ws://127.0.0.1:8777",
  // If that port was busy the relay moves up to the next free one; the page
  // scans this many ports from RELAY_URL so it still finds it. Keep in step
  // with relay.port.attempts in app.properties.
  RELAY_PORT_TRIES : 10,

  // Dock background: the stream Browser SOURCE stays transparent (true alpha).
  // To get a dark background in an OBS *docked* view, add ?bg=dark to the URL,
  // e.g.  file:///D:/.../merged-chat.html?bg=dark   (or end the URL with #dark).
  // DARK_BG_COLOR sets the shade used when ?bg=dark is present.
  DARK_BG_COLOR  : "#2a2a2e",
};
/* ================================================================= */
</script>

<style>
  :root { --fs: 18px; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;          /* transparent for OBS overlay */
    overflow: hidden;
    /* Default font. To use Teko instead, add "Teko", at the front:
       font-family: "Teko", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
       (Teko is condensed/smaller, so bump FONT_SIZE_PX up to ~24 if you do) */
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Feed grows from the bottom, like a real chat */
  #feed {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    padding: 10px;
    box-sizing: border-box;
    max-height: 100%;
  }

  .msg {
    font-size: var(--fs);
    line-height: 1.35;
    color: #fff;
    /* Strong outline so text stays readable over any video */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px  1px 0 #000, 1px  1px 0 #000,
       0    0   4px #000;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    animation: pop 0.18s ease-out;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* applied to old messages when FADE_OUT is on; duration set from JS */
  .msg.fade-out {
    opacity: 0;
    transition: opacity var(--fade-dur, 1s) ease-out;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7em;
    font-weight: 700;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 4px;
    margin-right: 6px;
    vertical-align: middle;
    color: #fff;
    text-shadow: none;
  }
  .badge.yt { background: #ff0033; }
  .badge.tw { background: #9147ff; }
  .badge svg {
    width: 1.05em;
    height: 1.05em;
    display: block;
    fill: currentColor;   /* white glyph */
  }

  .name {
    font-weight: 700;
    margin-right: 2px;
  }
  .name::after { content: ":"; color: #fff; }

  .text { color: #fff; }

  /* a moderator-deleted message, when SHOW_DELETED is on (otherwise the whole
     row is removed and this never shows) */
  .msg.deleted .text { color: #b9b9c2; font-style: italic; }
  .msg.deleted .name { opacity: 0.6; }

  .emote {
    height: 1.4em;
    vertical-align: middle;
    margin: 0 1px;
  }

  /* small mod / owner marker */
  .tag {
    display: inline-block;
    font-size: 0.62em;
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
    text-shadow: none;
    color: #fff;
  }
  .tag.owner  { background: #e8a200; }
  .tag.mod    { background: #00a152; }
  .tag.hmod   { background: #00a152; }  /* head mod — same green as mod */
  .tag.vip    { background: #e005b9; }
  .tag.sub    { background: #e02d2d; gap: 2px; }  /* Twitch subscriber */
  .tag.member { background: #e02d2d; }            /* YouTube member */
  .tag .mo    { font-size: 0.85em; font-weight: 700; line-height: 1; }
  .tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tag svg {
    width: 1.2em;
    height: 1.2em;
    display: block;
    fill: currentColor;   /* white glyph */
  }
  /* Make the moderator sword / head-mod hammer bigger and give it a dark edge so it pops on green */
  .tag.mod svg,
  .tag.hmod svg {
    width: 1.45em;
    height: 1.45em;
    filter: drop-shadow(0 0 0.5px rgba(0,0,0,.55));
  }

  /* Channel point redeem rows — purple-tinted so they stand out from chat */
  .msg.redeem {
    background: rgba(145, 71, 255, 0.28);
    border-left: 3px solid #9147ff;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .msg.redeem .name::after { content: ""; }   /* no trailing colon: "name redeemed X" */
  .tag.redeem { background: #9147ff; }
  .msg.redeem b { font-weight: 700; }
  .redeem-cost {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-weight: 700;
    margin-left: 6px;
    white-space: nowrap;
  }
  .redeem-cost svg {
    width: 0.95em;
    height: 0.95em;
    fill: currentColor;
    vertical-align: middle;
  }

  /* Sub / cheer / follow / raid / hype-train alert rows (colour by kind) */
  .msg.alert {
    background: rgba(255, 255, 255, 0.06);
    border-left: 3px solid #888;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .msg.alert .name::after { content: ""; }   /* no trailing colon */
  .msg.alert b { font-weight: 700; }
  .tag.alert { color: #fff; }
  .msg.alert.follow { border-left-color: #1f8fff; }
  .tag.alert.follow { background: #1f8fff; }
  .msg.alert.sub    { border-left-color: #e02d2d; }
  .tag.alert.sub    { background: #e02d2d; }
  .msg.alert.gift   { border-left-color: #e005b9; }
  .tag.alert.gift   { background: #e005b9; }
  .msg.alert.cheer  { border-left-color: #772ce8; }
  .tag.alert.cheer  { background: #772ce8; }
  .msg.alert.raid   { border-left-color: #e8a200; }
  .tag.alert.raid   { background: #e8a200; }
  .msg.alert.hype   { border-left-color: #ff5a36; }
  .tag.alert.hype   { background: #ff5a36; }

  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 12px;
    font-family: monospace;
    line-height: 1.6;
    color: #ddd;
    background: rgba(0,0,0,0.55);
    padding: 6px 10px;
    border-radius: 4px;
    max-width: 90%;
    transition: opacity 0.6s;
    z-index: 10;
  }
  #status.hidden { opacity: 0; }

  /* Docked mode (?docked=true): let the page scroll so you can scroll up through
     history. The feed flows in normal document flow and the document scrolls;
     when messages are sparse they still anchor to the bottom via min-height. */
  body.docked { overflow-y: auto; overflow-x: hidden; }
  body.docked #feed {
    position: static;
    min-height: 100%;
    max-height: none;
  }
  body.docked #status { position: fixed; }   /* keep status pinned while scrolling */
</style>
</head>

<body>
  <div id="status">starting…</div>
  <div id="feed"></div>

<script>
/* ----------------------------- setup ----------------------------- */
// Everything CONFIG drives that isn't re-read on every message. Called once at
// startup with the defaults below, and again when the relay sends the values
// from app.properties — so appearance can be changed in one place without
// editing this file.
function applyVisualConfig() {
  document.documentElement.style.setProperty("--fs", CONFIG.FONT_SIZE_PX + "px");
  document.documentElement.style.setProperty("--fade-dur", CONFIG.FADE_DURATION_SEC + "s");

  // Dark background for OBS docks: opt-in via ?bg=dark (or #dark) in the URL.
  // Stream Browser sources omit it, so they keep a transparent (alpha) background.
  const wantsDark = /(\?|&)bg=dark\b/.test(location.search) || location.hash === "#dark";
  if (wantsDark) {
    document.documentElement.style.background = CONFIG.DARK_BG_COLOR;
    document.body.style.background = CONFIG.DARK_BG_COLOR;
  }

  // Recomputed rather than fixed at load, so a relay config change takes effect.
  DOCK_RETAIN = IS_DOCKED && !!CONFIG.DOCK_RETAIN_ALL
    && !/(\?|&)retain=(false|0)\b/i.test(location.search);
  HEAD_MOD_SET = new Set((CONFIG.HEAD_MODS || [])
    .map(x => String(x).trim().toLowerCase()).filter(Boolean));

  if (typeof statusEl !== "undefined" && statusEl)
    statusEl.style.display = CONFIG.SHOW_STATUS ? "" : "none";
}

// Docked mode: opt-in via ?docked=true (or #docked) in the URL. Turns on the
// long scroll-back history (see DOCK_RETAIN_ALL). Fully independent of the
// ?bg=dark background option.
const IS_DOCKED = /(\?|&)docked=(true|1)\b/i.test(location.search) || location.hash === "#docked";
// ?setup (or #setup): show the one-time channel-point token setup page instead of chat.
const IS_SETUP = /(\?|&)setup\b/i.test(location.search) || location.hash === "#setup";

// YouTube keys in the order they'll be used: the primary first, then any
// backups. Quota is per Google Cloud project, so a key from a second project
// carries its own 10,000/day; when one drains mid-stream the polling loops move
// to the next instead of stopping for the day (see ytRotateKey).
// YT_API_KEY_DOCK is the old name for the second key — still honoured so an
// existing config keeps working, since it's now just another backup.
const YT_KEYS = [CONFIG.YT_API_KEY]
  .concat(CONFIG.YT_API_KEY_BACKUP || [], CONFIG.YT_API_KEY_DOCK || [])
  .map(k => (typeof k === "string" ? k : "").trim())
  .filter((k, i, all) => k && all.indexOf(k) === i);   // drop blanks + duplicates
let ytKeyIndex = 0;
function ytKey() { return YT_KEYS[ytKeyIndex] || ""; }

// Same idea for the Twitch alerts app: a dock with its own app gets its own
// EventSub subscriptions, instead of colliding with the stream source's (Twitch
// answers a duplicate type+channel on one app with 409). Falls back to the main
// app when the dock trio is blank. All three must be set to count as a dock app.
const TW_DOCK_APP = IS_DOCKED
  && (CONFIG.TWITCH_CLIENT_ID_DOCK || "").trim()
  && (CONFIG.TWITCH_CLIENT_SECRET_DOCK || "").trim()
  && (CONFIG.TWITCH_REFRESH_TOKEN_DOCK || "").trim();
const TW_CLIENT_ID = ((TW_DOCK_APP ? CONFIG.TWITCH_CLIENT_ID_DOCK : CONFIG.TWITCH_CLIENT_ID) || "").trim();
const TW_SECRET    = ((TW_DOCK_APP ? CONFIG.TWITCH_CLIENT_SECRET_DOCK : CONFIG.TWITCH_CLIENT_SECRET) || "").trim();
const TW_REFRESH   = ((TW_DOCK_APP ? CONFIG.TWITCH_REFRESH_TOKEN_DOCK : CONFIG.TWITCH_REFRESH_TOKEN) || "").trim();

console.log("[merged-chat] YouTube keys:", YT_KEYS.length,
  YT_KEYS.length > 1 ? "(1 primary + " + (YT_KEYS.length - 1) + " backup)" : "");
if (IS_DOCKED) {
  console.log("[merged-chat] docked mode:",
    TW_DOCK_APP ? "using dock Twitch app (own alert subscriptions)" : "sharing the main Twitch app's alerts");
}

// Docked retain-all: keep the full message history and let the page scroll.
// On by default in docked mode; disable per-URL with &retain=0 / &retain=false.
// Both of these are computed by applyVisualConfig(), so the relay can change
// them at runtime. Declared here only because that runs before their old homes.
let DOCK_RETAIN = false;
let HEAD_MOD_SET = new Set();
if (IS_DOCKED) document.body.classList.add("docked");

// In docked retain mode the document itself scrolls; keep it pinned to the
// newest message unless the user has scrolled up to read history.
// In docked mode the <body> is the actual scroll container (html stays
// overflow:hidden), so reference it directly — document.scrollingElement points
// at <html>, whose scrollTop never moves here, so pinning it would be a no-op.
const docScroller = IS_DOCKED ? document.body : (document.scrollingElement || document.documentElement);
function isPinnedToBottom() {
  return docScroller.scrollHeight - docScroller.scrollTop - docScroller.clientHeight < 60;
}
function scrollDockToBottom() { docScroller.scrollTop = docScroller.scrollHeight; }

// Whether the dock is "stuck" to the bottom. Starts stuck; unsticks when the
// user scrolls up; re-sticks the moment they scroll back down to the bottom.
// Driven by a live scroll listener so returning to the bottom always re-arms
// auto-follow (a per-message check could miss it if an emote image had nudged
// the scroll position off the bottom in the meantime).
let dockStuck = true;
if (IS_DOCKED) {
  // Bound whenever this is a dock, not only when DOCK_RETAIN is on at load —
  // the relay can turn retain on later, and re-binding then would be missed.
  // Bind to the scroller itself AND window: when <body> is the scroll container
  // the scroll event fires on it, not necessarily on window.
  const onDockScroll = () => { dockStuck = isPinnedToBottom(); };
  docScroller.addEventListener("scroll", onDockScroll, { passive: true });
  window.addEventListener("scroll", onDockScroll, { passive: true });
}

const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
applyVisualConfig();          // now that statusEl exists, apply the defaults

// One status line per source (twitch / youtube / demo), each on its own row.
const statusLines = {};
let statusTimer = null;
// Sources that have connected successfully at least once. Their later
// reconnect/retry chatter updates the text in place instead of popping the
// box back open mid-stream (see reconnectStatus below).
const statusConnected = {};
// Set once the box has auto-hidden, i.e. startup is over. After that, no
// connect/retry chatter is allowed to pop it open again (see reconnectStatus).
let statusSettled = false;

// `quiet` = update the line, but don't un-hide the box or restart the
// auto-hide timer. Repeating the same message is always a no-op, so a poll or
// retry loop saying the same thing can't make the box flash again.
function status(key, msg, quiet) {
  if (statusLines[key] === msg) return;
  console.log("[merged-chat]", key + ":", msg);
  statusLines[key] = msg;
  if (!CONFIG.SHOW_STATUS) return;
  statusEl.innerHTML = Object.values(statusLines)
    .filter(Boolean)
    .map(escapeHtml)
    .join("<br>");
  if (quiet) return;
  statusEl.classList.remove("hidden");
  clearTimeout(statusTimer);
  if (CONFIG.STATUS_HIDE_SEC > 0) {
    statusTimer = setTimeout(() => {
      statusEl.classList.add("hidden");
      statusSettled = true;
    }, CONFIG.STATUS_HIDE_SEC * 1000);
  }
}

// Status coming from a connect/reconnect/retry path. Shows normally during
// startup, while the box is still up; after the box has auto-hidden (or once
// the source has connected) it's routine churn, so it only updates the text
// quietly. Without this, a source stuck in a retry loop — its message flipping
// between "connecting…" and "retrying in Ns…" — re-opens the box forever.
function reconnectStatus(key, msg) {
  status(key, msg, statusSettled || statusConnected[key] === true);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// stable per-name color when the platform doesn't give us one
function colorFor(name) {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 70%, 66%)`;
}

// `msgId`, `userId`, `login` and `room` are only used to find this row again when
// a moderator deletes it (see removeMessages); everything else is presentation.
function addMessage({ platform, name, color, html, owner, headMod, mod, vip, sub, subMonths, member,
                      msgId, userId, login, room }) {
  const row = document.createElement("div");
  row.className = "msg " + platform;
  if (msgId) row.dataset.mid = msgId;
  if (userId) row.dataset.uid = userId;
  if (login) row.dataset.login = String(login).toLowerCase();
  if (room) row.dataset.room = room;

  let tagHtml = "";
  if (owner) tagHtml += `<span class="tag owner">${CAMERA_ICON}</span>`;
  else if (headMod) tagHtml += `<span class="tag hmod">${HEADMOD_ICON}</span>`;
  else if (mod) tagHtml += `<span class="tag mod">${MOD_ICON}</span>`;
  else if (vip) tagHtml += `<span class="tag vip">${VIP_ICON}</span>`;
  else if (sub) tagHtml += `<span class="tag sub">${STAR_ICON}${subMonths ? `<span class="mo">${subMonths}</span>` : ""}</span>`;
  else if (member) tagHtml += `<span class="tag member">${STAR_ICON}</span>`;

  const badgeInner = platform === "yt" ? YOUTUBE_ICON : TWITCH_ICON;

  row.innerHTML =
    `<span class="badge ${platform}">${badgeInner}</span>` +
    tagHtml +
    `<span class="name" style="color:${color}">${escapeHtml(name)}</span> ` +
    `<span class="text">${html}</span>`;

  placeRow(row);
}

// Retract messages a moderator deleted: `match(row)` picks which rows go.
// With SHOW_DELETED off the row leaves the feed entirely (what an on-stream
// overlay wants); with it on the row stays as a "message deleted" placeholder.
// Rows are scanned rather than looked up by selector because message IDs are
// opaque strings from two different services — iterating a few hundred rows on
// an event this rare is cheaper than getting attribute-selector escaping wrong.
function removeMessages(match) {
  let n = 0;
  for (const row of Array.from(feed.children)) {
    if (row.classList.contains("deleted") || !match(row)) continue;
    n++;
    if (CONFIG.SHOW_DELETED) {
      row.classList.add("deleted");
      const text = row.querySelector(".text");
      if (text) text.textContent = "message deleted";
    } else {
      row.remove();
    }
  }
  return n;
}

// Append a finished row, then trim to the cap, auto-scroll (docked mode) and
// schedule its fade-out. Shared by chat messages and channel-point redeem rows.
function placeRow(row) {
  // In docked mode, follow/trim only while stuck to the bottom (see dockStuck).
  const stuck = DOCK_RETAIN ? dockStuck : true;
  const cap = DOCK_RETAIN ? CONFIG.DOCK_MAX_MESSAGES : CONFIG.MAX_MESSAGES;

  feed.appendChild(row);

  // Trim to the cap. In docked mode only trim while stuck to the bottom, so the
  // view doesn't jump when the user has scrolled up reading history; the buffer
  // trims back down once they scroll back to the bottom.
  if (stuck) {
    while (feed.children.length > cap) {
      feed.removeChild(feed.firstChild);
    }
  }

  // Follow the newest message only if the user hadn't scrolled up.
  if (DOCK_RETAIN && stuck) {
    scrollDockToBottom();
    // Emote images load AFTER layout and push the bottom down, which would leave
    // us stranded a line or two above the newest message. Re-pin as each finishes.
    row.querySelectorAll("img").forEach(img => {
      if (img.complete) return;
      img.addEventListener("load", () => { if (dockStuck) scrollDockToBottom(); }, { once: true });
    });
  }

  // Optional: fade out and remove this message after it has lived its lifetime.
  // Skipped in docked retain mode so history stays intact for scrolling back.
  if (CONFIG.FADE_OUT && !DOCK_RETAIN) {
    setTimeout(() => {
      row.classList.add("fade-out");
      setTimeout(() => row.remove(), CONFIG.FADE_DURATION_SEC * 1000);
    }, CONFIG.MESSAGE_LIFE_SEC * 1000);
  }
}

/* =========================== RELAY CLIENT ========================= */
/* One local process (relay.py) does all the network I/O and re-broadcasts
   it to every open page, so an OBS Browser source and an OBS dock show
   byte-identical chat off a single YouTube quota and a single EventSub
   session.

   This replaced an in-browser localStorage bus. That approach looked sound
   — two file:// pages in OBS DO share a localStorage area — but measurement
   showed OBS never propagates a write from a Browser source to a dock while
   both are running. Each page only ever saw a frozen snapshot, so neither
   could see the other's lease, both elected themselves leader, and both ran
   their own feed. Hence the move out of the browser entirely.

   What crosses the wire is the RAW payload each page would have fetched
   itself (an IRC line, a liveChat item, an EventSub event), so all parsing,
   badge logic and emote rendering stays here and every view renders it the
   same way.

   If the relay isn't running, the page falls back to connecting directly,
   exactly as it did before — so the file still works on its own.          */

// Where the relay is. Normally CONFIG.RELAY_URL, but if this page arrived over
// http(s) it was served BY the relay — to a phone, tablet or second PC — so
// talk back to wherever we came from. On that device "127.0.0.1" would mean the
// device itself, which is nothing.
const RELAY_SERVED = /^https?:$/i.test(location.protocol) && !!location.host;
const RELAY_URL = RELAY_SERVED
  ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host
  : (CONFIG.RELAY_URL || "").trim();
// The relay walks its port upward when the configured one is taken, so scan the
// same range here rather than making you edit two files when that happens.
// No need when the relay served us — we already know exactly where it is.
const RELAY_PORT_TRIES = RELAY_SERVED ? 1 : Math.max(CONFIG.RELAY_PORT_TRIES | 0, 1);
let relaySocket = null;
let relayEverConnected = false;
let relayPortOffset = 0;        // the offset that worked, reused on reconnect

function relayHistoryWanted() {
  // Only a dock wants scroll-back; a refreshed overlay should come back clean
  // rather than dumping old lines back on stream.
  return DOCK_RETAIN ? (CONFIG.DOCK_MAX_MESSAGES | 0) : 0;
}

// RELAY_URL with its port shifted up by `offset`.
function relayUrlFor(offset) {
  const m = /^(wss?:\/\/[^/:]+):(\d+)(.*)$/i.exec(RELAY_URL);
  if (!m) return RELAY_URL;     // no explicit port: use it exactly as given
  return m[1] + ":" + (parseInt(m[2], 10) + offset) + m[3];
}

// Try the relay. `onFallback` runs only after every port in the range has
// failed, so the page connects directly instead of showing nothing.
function connectRelay(onFallback, offset) {
  offset = offset || 0;
  const base = relayUrlFor(offset);
  const url = base + (base.includes("?") ? "&" : "?")
            + "history=" + relayHistoryWanted();
  let settled = false;

  const tryNext = () => {
    if (offset + 1 < RELAY_PORT_TRIES) { connectRelay(onFallback, offset + 1); return true; }
    return false;
  };

  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    if (!tryNext() && onFallback) onFallback();
    return;
  }
  relaySocket = ws;

  ws.onopen = () => {
    settled = true;
    relayEverConnected = true;
    relayPortOffset = offset;   // remember it so reconnects skip the scan
    console.log("[merged-chat] relay: connected to " + base);
    status("relay", "");        // clear any "connecting"/"lost" line
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    relayHandle(msg);
  };

  ws.onclose = () => {
    relaySocket = null;
    if (!settled && !relayEverConnected) {
      // Nothing on this port. Walk up the range before giving up — the relay
      // may have moved because the configured port was taken.
      if (tryNext()) return;
      console.log("[merged-chat] relay: not reachable on " + relayUrlFor(0) +
                  " (+" + (RELAY_PORT_TRIES - 1) + " ports), falling back to direct mode");
      if (onFallback) onFallback();
      return;
    }
    // We had it and lost it: keep trying, don't start a second direct feed
    // alongside the relay's (that's how you get two different chats).
    status("relay", "Relay: lost connection, reconnecting…");
    setTimeout(() => connectRelay(null, relayPortOffset), 3000);
  };

  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

// Adopt the appearance settings the relay read out of app.properties. That file
// is the single place to change how chat looks once you're running the relay;
// the CONFIG block above is only what a page falls back to without one.
// Unknown or missing keys are left at their defaults, so an older app.properties
// keeps working.
function applyRelayConfig(cfg) {
  if (!cfg || typeof cfg !== "object") return;
  let changed = 0;
  for (const k in cfg) {
    if (cfg[k] === null || cfg[k] === undefined) continue;
    CONFIG[k] = cfg[k];
    changed++;
  }
  if (!changed) return;
  applyVisualConfig();
  console.log("[merged-chat] relay: applied " + changed + " settings from app.properties");
}

function relayHandle(msg) {
  switch (msg.t) {
    case "hello":
      // Appearance settings from app.properties, applied BEFORE any replay so
      // the backlog is rendered with the right font size, caps and badges.
      applyRelayConfig(msg.config);
      for (const past of msg.history || []) relayHandle(past);
      for (const k in (msg.status || {})) status(k, msg.status[k], true);
      break;
    case "irc":
      handleIrcLine(msg.line);
      break;
    case "yt":
      addYouTubeItem(msg.item);
      break;
    case "alert":
      handleAlert(msg.subType, msg.event);
      break;
    case "status":
      status(msg.key, msg.msg, statusSettled);
      break;
  }
}

/* ============================= TWITCH ============================= */
/* Anonymous IRC over WebSocket — no key, no account needed.         */
function parseIRC(line) {
  let tags = {}, rest = line;
  if (rest[0] === "@") {
    const sp = rest.indexOf(" ");
    for (const part of rest.slice(1, sp).split(";")) {
      const eq = part.indexOf("=");
      tags[part.slice(0, eq)] = part.slice(eq + 1);
    }
    rest = rest.slice(sp + 1);
  }
  let prefix = "";
  if (rest[0] === ":") {
    const sp = rest.indexOf(" ");
    prefix = rest.slice(1, sp);
    rest = rest.slice(sp + 1);
  }
  const sp = rest.indexOf(" ");
  const command = sp === -1 ? rest : rest.slice(0, sp);
  let params = sp === -1 ? "" : rest.slice(sp + 1);

  let middle = params, text = "";
  if (params.startsWith(":")) { text = params.slice(1); middle = ""; }
  else {
    const ci = params.indexOf(" :");
    if (ci !== -1) { text = params.slice(ci + 2); middle = params.slice(0, ci); }
  }
  return { tags, prefix, command, middle, text };
}

// Replace Twitch emote ranges (from IRC tags) with emote images.
function renderTwitch(text, emotesTag) {
  const chars = Array.from(text); // code-point aware (Twitch indexes by code point)
  if (!emotesTag) return escapeHtml(text);

  const reps = [];
  for (const group of emotesTag.split("/")) {
    if (!group) continue;
    const [id, positions] = group.split(":");
    for (const pos of positions.split(",")) {
      const [s, e] = pos.split("-").map(Number);
      reps.push({ start: s, end: e, id });
    }
  }
  reps.sort((a, b) => a.start - b.start);

  let out = "", idx = 0;
  for (const r of reps) {
    out += escapeHtml(chars.slice(idx, r.start).join(""));
    const name = chars.slice(r.start, r.end + 1).join("");
    out += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0" alt="${escapeHtml(name)}" title="${escapeHtml(name)}">`;
    idx = r.end + 1;
  }
  out += escapeHtml(chars.slice(idx).join(""));
  return out;
}

// YouTube only sends emotes as :shortcode: text (no image data), so we map known
// shortcodes to image URLs ourselves (see CONFIG.YT_EMOTES). Any shortcode we DON'T
// have a URL for is logged once to the console (F12) to make filling the map easy.
const _ytSeenShortcodes = new Set();
const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function renderYouTube(text) {
  const map = CONFIG.YT_EMOTES || {};
  for (const m of text.matchAll(/:_?[\w+-]{2,}:/g)) {
    if (!map[m[0]] && !_ytSeenShortcodes.has(m[0])) {
      _ytSeenShortcodes.add(m[0]);
      console.log("[merged-chat] unmapped YouTube emote shortcode:", m[0]);
    }
  }
  const codes = Object.keys(map).sort((a, b) => b.length - a.length); // longest first
  if (!codes.length) return escapeHtml(text);

  const re = new RegExp(codes.map(escapeRegex).join("|"), "g");
  let out = "", last = 0, m;
  while ((m = re.exec(text)) !== null) {
    out += escapeHtml(text.slice(last, m.index));
    const code = m[0];
    out += `<img class="emote" src="${map[code]}" alt="${escapeHtml(code)}" title="${escapeHtml(code)}">`;
    last = m.index + code.length;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

// Collect every channel to join from TWITCH_CHANNEL + TWITCH_CHANNELS,
// normalized (lowercase, no leading '#', trimmed) and de-duplicated.
function twitchChannels() {
  const raw = [];
  if (CONFIG.TWITCH_CHANNEL) raw.push(CONFIG.TWITCH_CHANNEL);
  if (Array.isArray(CONFIG.TWITCH_CHANNELS)) raw.push(...CONFIG.TWITCH_CHANNELS);

  const seen = new Set(), out = [];
  for (const c of raw) {
    const name = String(c).trim().toLowerCase().replace(/^#/, "");
    if (name && !seen.has(name)) { seen.add(name); out.push(name); }
  }
  return out;
}

function connectTwitch() {
  const channels = twitchChannels();
  if (!channels.length) { status("twitch", "Twitch: no channel set"); return; }
  const label = channels.map(c => "#" + c).join(" ");
  reconnectStatus("twitch", "Twitch: connecting to " + label + "…");
  const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    ws.send("NICK justinfan" + Math.floor(Math.random() * 100000)); // anonymous
    for (const c of channels) ws.send("JOIN #" + c);               // one socket, many channels
    reconnectStatus("twitch", "Twitch: connected to " + label);
    statusConnected.twitch = true;
  };

  ws.onmessage = (ev) => {
    for (const line of ev.data.split("\r\n")) {
      if (!line) continue;
      if (line.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); continue; }
      handleIrcLine(line);
    }
  };

  ws.onclose = () => {
    reconnectStatus("twitch", "Twitch: disconnected, reconnecting in 3s…");
    setTimeout(connectTwitch, 3000);
  };
  ws.onerror = () => ws.close();
}

// Render one raw IRC line. Split out from the socket handler so relay mode can
// feed in lines the relay read on its behalf — same parsing either way.
function handleIrcLine(line) {
      const m = parseIRC(line);

      // Moderation. CLEARMSG deletes one message (target-msg-id matches the `id`
      // tag the PRIVMSG carried). CLEARCHAT with a target is a timeout or ban,
      // which wipes everything that user had said; with no target it's a /clear
      // of that channel alone — the other merged channels keep their messages.
      if (m.command === "CLEARMSG") {
        const id = m.tags["target-msg-id"];
        if (id) removeMessages(r => r.dataset.mid === id);
        return;
      }
      if (m.command === "CLEARCHAT") {
        const uid = m.tags["target-user-id"];
        const login = (m.text || "").trim().toLowerCase();
        const room = (m.middle || "").trim().replace(/^#/, "").toLowerCase();
        removeMessages(r =>
          r.classList.contains("tw") && (
            (uid || login)
              ? ((uid && r.dataset.uid === uid) || (login && r.dataset.login === login))
              : (!room || r.dataset.room === room)));
        return;
      }

      if (m.command !== "PRIVMSG") return;

      const nick = m.prefix.split("!")[0];
      const name = m.tags["display-name"] || nick;
      const color = m.tags["color"] || colorFor(name);
      const badges = m.tags["badges"] || "";
      const badgeInfo = m.tags["badge-info"] || "";
      const isSub = badges.includes("subscriber") || badges.includes("founder");
      // Exact cumulative months live in badge-info; fall back to the badges tier.
      const subMatch = isSub
        ? (/(?:subscriber|founder)\/(\d+)/.exec(badgeInfo) ||
           /(?:subscriber|founder)\/(\d+)/.exec(badges))
        : null;
      const isMod = badges.includes("moderator");
      const isHeadMod = isMod && HEAD_MOD_SET.has(nick.toLowerCase());

      addMessage({
        platform: "tw",
        name,
        color,
        html: renderTwitch(m.text, m.tags["emotes"]),
        owner: badges.includes("broadcaster"),
        headMod: isHeadMod,
        mod: isMod,
        vip: badges.includes("vip"),
        sub: isSub,
        subMonths: subMatch ? subMatch[1] : "",
        msgId: m.tags["id"],
        userId: m.tags["user-id"],
        login: nick,
        room: (m.middle || "").trim().replace(/^#/, "").toLowerCase(),
      });
}

/* ================= TWITCH CHANNEL POINT REDEEMS ================== */
/* Channel points don't travel over chat (IRC), so anonymous mode can't    */
/* see them. This uses Twitch EventSub over WebSocket, with a broadcaster   */
/* token (channel:read:redemptions) that AUTO-REFRESHES so it never dies    */
/* mid-stream. Run ?setup once to mint TWITCH_REFRESH_TOKEN.                */

// Live redeem auth state. The access token is short-lived and refilled by
// refreshRedeemToken(); the refresh token can rotate, so we track it in memory.
// Scopes the alerts + redeems need. Raids need none; the rest each map to one.
// ?setup requests them all so you never have to re-authorize when toggling.
const ALERT_SCOPES = [
  "channel:read:redemptions",   // channel points
  "moderator:read:followers",   // follows
  "channel:read:subscriptions", // subs / resubs / gift subs
  "bits:read",                  // cheers
  "channel:read:hype_train",    // hype trains
];

const redeemState = {
  accessToken: "",
  refreshToken: "",
  userId: "",
  login: "",
  scopes: [],
  refreshTimer: null,
  // Set when reconnecting can't possibly help (every subscription came back 409
  // — another page owns them). Twitch closes a session that subscribed to
  // nothing, so without this the socket would retry every 5s forever.
  giveUp: false,
};

// Build + place a redeem row. `e` is the EventSub event payload, which carries
// the human-readable reward title and cost (things IRC never gives us).
function addRedeemMessage(e) {
  const name = e.user_name || e.user_login || "someone";
  const reward = e.reward?.title || "a reward";
  const cost = e.reward?.cost;
  const input = (e.user_input || "").trim();

  const row = document.createElement("div");
  row.className = "msg tw redeem";

  const costHtml = (typeof cost === "number")
    ? `<span class="redeem-cost">${POINTS_ICON}${cost.toLocaleString()}</span>`
    : "";

  row.innerHTML =
    `<span class="badge tw">${TWITCH_ICON}</span>` +
    `<span class="tag redeem">${POINTS_ICON}</span>` +
    `<span class="name" style="color:${colorFor(name)}">${escapeHtml(name)}</span> ` +
    `<span class="text">redeemed <b>${escapeHtml(reward)}</b>${costHtml}` +
      (input ? ` — ${escapeHtml(input)}` : "") +
    `</span>`;

  placeRow(row);
}

// Trade the refresh token for a fresh access token, learn who it belongs to,
// and schedule the next refresh a few minutes before expiry. Returns true on
// success, "dead" if the refresh token is unusable (setup must be re-run), or
// false on a transient error worth retrying.
async function refreshRedeemToken() {
  let r, d;
  try {
    r = await fetch("https://id.twitch.tv/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "refresh_token",
        refresh_token: redeemState.refreshToken,
        client_id: TW_CLIENT_ID,
        client_secret: TW_SECRET,
      }),
    });
    d = await r.json().catch(() => ({}));
  } catch (err) {
    status("redeems", "Redeems: token refresh network error — " + err.message + " (retrying)");
    return false;
  }

  if (!r.ok || !d.access_token) {
    const msg = d.message || d.error || ("HTTP " + r.status);
    // 400/401 here means the refresh token itself is bad -> setup must be redone.
    if (r.status === 400 || r.status === 401) {
      status("redeems", "Redeems: refresh token invalid — re-run ?setup (" + msg + ")");
      return "dead";
    }
    status("redeems", "Redeems: token refresh failed — " + msg + " (retrying)");
    return false;
  }

  redeemState.accessToken = d.access_token;
  if (d.refresh_token) redeemState.refreshToken = d.refresh_token; // handle rotation

  // First time: validate to learn the broadcaster's user id/login and which
  // scopes were granted (we subscribe only to events whose scope is present).
  if (!redeemState.userId) {
    try {
      const v = await fetch("https://id.twitch.tv/oauth2/validate", {
        headers: { Authorization: "OAuth " + redeemState.accessToken },
      });
      const vd = await v.json();
      redeemState.userId = vd.user_id || "";
      redeemState.login = vd.login || "";
      redeemState.scopes = vd.scopes || [];
    } catch (err) {
      status("redeems", "Redeems: token validate error — " + err.message);
      return false;
    }
  }

  // Re-arm the proactive refresh ~5 min before this token expires (default ~4h).
  clearTimeout(redeemState.refreshTimer);
  const ms = Math.max(((d.expires_in || 14400) - 300) * 1000, 60000);
  redeemState.refreshTimer = setTimeout(function tick() {
    refreshRedeemToken().then((res) => {
      if (res === false) setTimeout(tick, 30000); // transient: retry soon
    });
  }, ms);
  return true;
}

// Entry point: check config, get the first access token, then open EventSub.
async function startTwitchRedeems() {
  if (!CONFIG.SHOW_REDEEMS) return;
  if (!TW_CLIENT_ID || !TW_SECRET || !TW_REFRESH) {
    status("redeems", "Redeems: off (open ?setup once to enable channel points)");
    return;
  }
  const refresh = TW_REFRESH;
  // Seed from config only if we don't already hold a (possibly rotated) token.
  if (!redeemState.refreshToken) redeemState.refreshToken = refresh;

  reconnectStatus("redeems", "Redeems: getting access token…");
  const ok = await refreshRedeemToken();
  if (ok !== true) return; // "dead"/false already reported a clear status

  connectRedeemSocket("wss://eventsub.wss.twitch.tv/ws", false);
}

// One EventSub WebSocket. On welcome we create the subscription (except on a
// reconnect socket, where Twitch carries the existing subscription over). Uses
// the current auto-refreshed access token, so the socket outlives token expiry.
function connectRedeemSocket(url, isReconnect) {
  reconnectStatus("redeems", isReconnect ? "Redeems: reconnecting…" : "Redeems: connecting EventSub…");
  const ws = new WebSocket(url);
  let keepaliveMs = 30000, keepaliveTimer = null;

  const armKeepalive = () => {
    clearTimeout(keepaliveTimer);
    // If Twitch goes quiet past the keepalive window (+ slack), treat the socket
    // as dead and close it; onclose reconnects.
    keepaliveTimer = setTimeout(() => { try { ws.close(); } catch (_) {} }, keepaliveMs + 10000);
  };

  ws.onmessage = async (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
    const type = msg.metadata && msg.metadata.message_type;
    armKeepalive();

    if (type === "session_welcome") {
      const session = msg.payload.session;
      keepaliveMs = (session.keepalive_timeout_seconds || 30) * 1000;
      armKeepalive();
      if (isReconnect) reconnectStatus("redeems", "Alerts: reconnected — watching " + redeemState.login);
      else await subscribeAll(session.id);
    } else if (type === "notification") {
      handleAlert(msg.payload.subscription.type, msg.payload.event);
    } else if (type === "session_reconnect") {
      // Twitch wants us on a fresh URL. Open it, then drop this socket shortly after.
      ws._replaced = true;
      connectRedeemSocket(msg.payload.session.reconnect_url, true);
      setTimeout(() => { try { ws.close(); } catch (_) {} }, 2000);
    } else if (type === "revocation") {
      // Subscription killed (token/authorization issue). Refresh + restart once.
      reconnectStatus("redeems", "Redeems: subscription revoked — reconnecting…");
      ws._replaced = true;
      try { ws.close(); } catch (_) {}
      setTimeout(startTwitchRedeems, 3000);
    }
    // session_keepalive needs no work beyond armKeepalive() above.
  };

  ws.onclose = () => {
    clearTimeout(keepaliveTimer);
    if (ws._replaced) return;              // superseded by a reconnect/restart
    if (redeemState.giveUp) return;        // nothing left to subscribe to (see subscribeAll)
    reconnectStatus("redeems", "Redeems: disconnected, retrying in 5s…");
    setTimeout(() => connectRedeemSocket("wss://eventsub.wss.twitch.tv/ws", false), 5000);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}

// Twitch subscription tier code -> friendly name.
function tierName(tier) {
  return ({ "1000": "Tier 1", "2000": "Tier 2", "3000": "Tier 3" })[tier] || "Tier 1";
}

// A single alert/event row (sub, cheer, follow, raid, hype…). `textHtml` is
// already-safe HTML; `name` is escaped here. `kind` drives the pill colour.
function addAlertRow(kind, iconSvg, name, textHtml) {
  const row = document.createElement("div");
  row.className = "msg tw alert " + kind;
  const namePart = name
    ? `<span class="name" style="color:${colorFor(name)}">${escapeHtml(name)}</span> `
    : "";
  row.innerHTML =
    `<span class="badge tw">${TWITCH_ICON}</span>` +
    `<span class="tag alert ${kind}">${iconSvg}</span>` +
    namePart +
    `<span class="text">${textHtml}</span>`;
  placeRow(row);
}

// Route an EventSub notification to the right row renderer.
function handleAlert(subType, e) {
  switch (subType) {
    case "channel.channel_points_custom_reward_redemption.add":
      addRedeemMessage(e);
      break;
    case "channel.follow":
      addAlertRow("follow", HEART_ICON, e.user_name, "followed");
      break;
    case "channel.subscribe":
      if (e.is_gift) break; // gift recipients are announced by the gift event
      addAlertRow("sub", STAR_ICON, e.user_name, "subscribed <b>" + tierName(e.tier) + "</b>");
      break;
    case "channel.subscription.message": {
      const months = e.cumulative_months || 0;
      const msgText = e.message && e.message.text ? " — " + escapeHtml(e.message.text) : "";
      addAlertRow("sub", STAR_ICON, e.user_name,
        "resubscribed <b>" + tierName(e.tier) + "</b>" +
        (months ? " · " + months + " month" + (months === 1 ? "" : "s") : "") + msgText);
      break;
    }
    case "channel.subscription.gift": {
      const who = e.is_anonymous ? "Anonymous" : (e.user_name || "Someone");
      const n = e.total || 1;
      addAlertRow("gift", GIFT_ICON, who,
        "gifted <b>" + n + "</b> " + tierName(e.tier) + " sub" + (n === 1 ? "" : "s"));
      break;
    }
    case "channel.cheer": {
      const who = e.is_anonymous ? "Anonymous" : (e.user_name || "Someone");
      const msgText = e.message ? " — " + escapeHtml(e.message) : "";
      addAlertRow("cheer", BITS_ICON, who,
        "cheered <b>" + (e.bits || 0).toLocaleString() + "</b> bits" + msgText);
      break;
    }
    case "channel.raid":
      addAlertRow("raid", RAID_ICON, e.from_broadcaster_user_name,
        "raided with <b>" + (e.viewers || 0).toLocaleString() + "</b> viewer" + (e.viewers === 1 ? "" : "s"));
      break;
    case "channel.hype_train.begin":
      addAlertRow("hype", HYPE_ICON, "", "Hype Train started! <b>Level " + (e.level || 1) + "</b>");
      break;
  }
}

// Build the list of EventSub subscriptions to create, honouring the SHOW_*
// toggles. Each carries the scope it needs (null = none) so we can skip any the
// token wasn't granted instead of getting a 403.
function alertSubDefs() {
  const bid = redeemState.userId;
  const a = CONFIG.SHOW_ALERTS || {};
  const defs = [];
  if (CONFIG.SHOW_REDEEMS)
    defs.push({ type: "channel.channel_points_custom_reward_redemption.add", version: "1", scope: "channel:read:redemptions", condition: { broadcaster_user_id: bid } });
  if (a.follows)
    defs.push({ type: "channel.follow", version: "2", scope: "moderator:read:followers", condition: { broadcaster_user_id: bid, moderator_user_id: bid } });
  if (a.subs) {
    defs.push({ type: "channel.subscribe", version: "1", scope: "channel:read:subscriptions", condition: { broadcaster_user_id: bid } });
    defs.push({ type: "channel.subscription.message", version: "1", scope: "channel:read:subscriptions", condition: { broadcaster_user_id: bid } });
  }
  if (a.giftSubs)
    defs.push({ type: "channel.subscription.gift", version: "1", scope: "channel:read:subscriptions", condition: { broadcaster_user_id: bid } });
  if (a.cheers)
    defs.push({ type: "channel.cheer", version: "1", scope: "bits:read", condition: { broadcaster_user_id: bid } });
  if (a.raids)
    defs.push({ type: "channel.raid", version: "1", scope: null, condition: { to_broadcaster_user_id: bid } });
  if (a.hypeTrain)
    // v2 only — Twitch retired version 1 ("invalid subscription type and version").
    defs.push({ type: "channel.hype_train.begin", version: "2", scope: "channel:read:hype_train", condition: { broadcaster_user_id: bid } });
  return defs;
}

// Create every enabled subscription on this session (skipping ones the token
// lacks scope for). Must run within 10s of the welcome or Twitch drops us.
async function subscribeAll(sessionId) {
  const have = new Set(redeemState.scopes || []);
  let ok = 0;
  const missing = [];
  let duplicate = 0, lastErr = "";
  for (const def of alertSubDefs()) {
    if (def.scope && !have.has(def.scope)) { missing.push(def.type); continue; }
    const res = await createSubscription(def, sessionId);
    if (res === true) ok++;
    else if (res === 409) duplicate++;
    else if (res) lastErr = res;
  }
  let msg = "Alerts: watching " + redeemState.login + " (" + ok + " event type" + (ok === 1 ? "" : "s") + ")";
  if (missing.length) msg += " — re-run ?setup to grant the rest";
  if (ok) statusConnected.redeems = true;
  else if (duplicate) {
    // Nothing subscribed and at least one was a duplicate: another page owns
    // these, and reconnecting can't take them back. Stop, so a session Twitch
    // closes for having no subscriptions can't spin the 5s retry loop forever.
    redeemState.giveUp = true;
    // Twitch allows one subscription per app + event type + channel. Another
    // page (usually the stream source vs. the dock) already owns these.
    msg = IS_DOCKED && !TW_DOCK_APP
      ? "Alerts: already claimed by the stream source — set TWITCH_*_DOCK for a dock app"
      : "Alerts: already claimed by another open copy of this page";
  } else if (missing.length && !lastErr) msg = "Alerts: nothing subscribed — re-run ?setup to grant scopes";
  else if (lastErr) msg = "Alerts: nothing subscribed — " + lastErr;
  else msg = "Alerts: nothing subscribed — re-run ?setup";
  status("redeems", msg);
}

// Create one subscription. Failures are logged (F12) and skipped, not fatal, so
// one missing scope can't stop the others from working. Returns true on success,
// 409 for "this app already has this subscription" (see subscribeAll), or a short
// error string otherwise.
async function createSubscription(def, sessionId) {
  try {
    const r = await fetch("https://api.twitch.tv/helix/eventsub/subscriptions", {
      method: "POST",
      headers: {
        "Client-Id": TW_CLIENT_ID,
        Authorization: "Bearer " + redeemState.accessToken,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        type: def.type,
        version: def.version,
        condition: def.condition,
        transport: { method: "websocket", session_id: sessionId },
      }),
    });
    if (r.ok) return true;
    const err = await r.json().catch(() => ({}));
    const why = err.message || ("HTTP " + r.status);
    console.warn("[merged-chat] subscribe failed:", def.type, "-", why);
    return r.status === 409 ? 409 : why;
  } catch (err) {
    console.warn("[merged-chat] subscribe error:", def.type, err.message);
    return err.message || "network error";
  }
}

/* --------- ?setup: one-time page to mint a refresh token --------- */
// Renders a small two-step page (instead of the chat) that walks through the
// Twitch OAuth authorization-code flow and hands back a long-lived refresh token
// to paste into CONFIG.TWITCH_REFRESH_TOKEN. All in-browser (token endpoint is
// CORS-open); nothing leaves this machine except the calls to Twitch itself.
function runRedeemSetup() {
  // ?setup&docked=true mints a token for the DOCK app instead. Can't reuse
  // TW_CLIENT_ID here: that only switches once the dock refresh token exists,
  // and minting it is exactly what this page is for. So key off IS_DOCKED.
  const forDock = IS_DOCKED;
  const clientId = ((forDock ? CONFIG.TWITCH_CLIENT_ID_DOCK : CONFIG.TWITCH_CLIENT_ID) || "").trim();
  const secret = ((forDock ? CONFIG.TWITCH_CLIENT_SECRET_DOCK : CONFIG.TWITCH_CLIENT_SECRET) || "").trim();
  const tokenField = forDock ? "TWITCH_REFRESH_TOKEN_DOCK" : "TWITCH_REFRESH_TOKEN";
  const REDIRECT = "http://localhost";

  document.body.classList.remove("docked");
  document.documentElement.style.background = "#18181b";
  document.body.style.background = "#18181b";
  document.body.style.overflow = "auto";
  document.body.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.style.cssText =
    "max-width:720px;margin:24px auto;padding:0 18px;color:#efeff1;" +
    "font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.55;";
  document.body.appendChild(wrap);
  const add = (html) => { const d = document.createElement("div"); d.innerHTML = html; wrap.appendChild(d); return d; };

  if (!clientId || !secret) {
    add(`<h2 style="color:#bf94ff">Channel point redeems — setup</h2>
      <p style="color:#ff8a8a">First fill in <b>${forDock ? "TWITCH_CLIENT_ID_DOCK" : "TWITCH_CLIENT_ID"}</b>
      and <b>${forDock ? "TWITCH_CLIENT_SECRET_DOCK" : "TWITCH_CLIENT_SECRET"}</b>
      in the file (from <a style="color:#bf94ff" href="https://dev.twitch.tv/console/apps" target="_blank">dev.twitch.tv/console/apps</a>
      — Redirect URL <code>http://localhost</code>), save, then reload this page.</p>`);
    return;
  }

  const authUrl = "https://id.twitch.tv/oauth2/authorize?" + new URLSearchParams({
    client_id: clientId,
    redirect_uri: REDIRECT,
    response_type: "code",
    scope: ALERT_SCOPES.join(" "),
    force_verify: "true",
  });

  add(`<h2 style="color:#bf94ff">Channel point redeems — one-time setup</h2>
    <p><b>Step 1.</b> Authorize your Twitch (broadcaster) account:</p>
    <p><a href="${authUrl}" target="_blank"
       style="display:inline-block;background:#9147ff;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none;font-weight:700">
       Authorize with Twitch</a></p>
    <p style="color:#adadb8">Your browser will jump to a <code>http://localhost/?code=…</code> page that
    fails to load — that's expected. Copy the whole address bar (or just the <code>code=…</code> value)
    and paste it below.</p>
    <p style="margin-top:18px"><b>Step 2.</b> Paste it here:</p>`);

  const ta = document.createElement("textarea");
  ta.placeholder = "http://localhost/?code=abcd1234...&scope=channel%3Aread%3Aredemptions";
  ta.style.cssText =
    "width:100%;height:70px;background:#0e0e10;color:#efeff1;border:1px solid #444;" +
    "border-radius:6px;padding:8px;font-family:monospace;box-sizing:border-box";
  wrap.appendChild(ta);

  const btn = document.createElement("button");
  btn.textContent = "Get my refresh token";
  btn.style.cssText =
    "margin-top:10px;background:#9147ff;color:#fff;border:0;padding:10px 16px;" +
    "border-radius:6px;font-weight:700;cursor:pointer";
  wrap.appendChild(btn);

  const out = document.createElement("div");
  out.style.cssText = "margin-top:16px";
  wrap.appendChild(out);

  btn.onclick = async () => {
    const raw = ta.value.trim();
    const m = raw.match(/[?&]code=([^&\s]+)/) || raw.match(/^([A-Za-z0-9]+)$/);
    const code = m ? decodeURIComponent(m[1]) : "";
    if (!code) {
      out.innerHTML = `<p style="color:#ff8a8a">Couldn't find a code there. Paste the whole
        localhost URL, or just the code value.</p>`;
      return;
    }
    out.innerHTML = `<p style="color:#adadb8">Exchanging…</p>`;
    try {
      const r = await fetch("https://id.twitch.tv/oauth2/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: clientId,
          client_secret: secret,
          code,
          redirect_uri: REDIRECT,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.refresh_token) {
        out.innerHTML = `<p style="color:#ff8a8a">Failed: ${escapeHtml(d.message || d.error || ("HTTP " + r.status))}.
          Auth codes are single-use and expire within seconds — redo Step 1 for a fresh one.</p>`;
        return;
      }
      out.innerHTML =
        `<p style="color:#7bd88f"><b>Success!</b> Paste this into <code>${tokenField}</code>
         in the file, save, then refresh the OBS ${forDock ? "dock" : "source"}:</p>`;
      const box = document.createElement("textarea");
      box.readOnly = true;
      box.value = d.refresh_token;
      box.style.cssText =
        "width:100%;height:60px;background:#0e0e10;color:#7bd88f;border:1px solid #444;" +
        "border-radius:6px;padding:8px;font-family:monospace;box-sizing:border-box";
      out.appendChild(box);
      box.focus(); box.select();
    } catch (err) {
      out.innerHTML = `<p style="color:#ff8a8a">Error: ${escapeHtml(err.message)}</p>`;
    }
  };
}

/* ============================= YOUTUBE ============================ */
/* YouTube Data API v3 — needs an API key (see header comment).      */
/* NOTE: each YouTube chat polled here uses your daily API quota, so  */
/* merging several at once burns it proportionally faster.            */

// Collect every video ID from YT_VIDEO_ID + YT_VIDEO_IDS, trimmed & de-duped.
function youtubeVideoIds() {
  const raw = [];
  if (CONFIG.YT_VIDEO_ID) raw.push(CONFIG.YT_VIDEO_ID);
  if (Array.isArray(CONFIG.YT_VIDEO_IDS)) raw.push(...CONFIG.YT_VIDEO_IDS);

  const seen = new Set(), out = [];
  for (const v of raw) {
    const id = String(v).trim();
    if (id && !seen.has(id)) { seen.add(id); out.push(id); }
  }
  return out;
}

function startYouTube() {
  if (!YT_KEYS.length) { status("youtube", "YouTube: no API key set (Twitch only)"); return; }
  const ids = youtubeVideoIds();
  if (!ids.length) { status("youtube", "YouTube: no video ID set"); return; }

  // One independent connect + poll loop per video, each with its own status line.
  ids.forEach((id, i) => {
    const statusKey = ids.length > 1 ? "youtube" + (i + 1) : "youtube";
    startYouTubeVideo(id, statusKey);
  });
}

/* --- Error handling ------------------------------------------------ */
/* Quota is finite (see YT_MIN_POLL_MS), so a broken poll loop must never
   retry forever in the background. Errors split two ways:
     FATAL     — nothing will fix itself (quota gone, bad key, chat ended).
                 Stop the loop; retrying only burns requests.
     TRANSIENT — network blip, rate limit, Google 5xx, unrecognised error.
                 Retry with exponential backoff, then give up after
                 YT_MAX_RETRIES so a dead stream can't poll all night.     */

// API error reasons where retrying is pointless.
const YT_FATAL_REASONS = new Set([
  "quotaExceeded", "dailyLimitExceeded",              // out of quota until midnight PT
  "keyInvalid", "ipRefererBlocked", "accessNotConfigured",
  "authenticationFailure", "forbidden",               // key / project misconfigured
  "liveChatEnded", "liveChatNotFound", "liveChatDisabled",
  "videoNotFound", "notFound",                        // the stream is gone
]);
// A drained key affects every loop on it, not just the one that noticed.
const YT_QUOTA_REASONS = new Set(["quotaExceeded", "dailyLimitExceeded"]);

let ytQuotaExhausted = false;   // set once; stops all YouTube polling on this key

// Machine-readable reason out of a Data API error payload ("" if absent).
function ytErrorReason(err) {
  return err?.errors?.[0]?.reason || err?.status || "";
}

// Exponential backoff with jitter, so several merged loops don't retry in sync.
function ytBackoffMs(tries) {
  const base = Math.max(CONFIG.YT_MIN_POLL_MS || 0, 5000);
  const cap  = Math.max(CONFIG.YT_BACKOFF_MAX_MS || 300000, base);
  const wait = Math.min(base * Math.pow(2, tries - 1), cap);
  return Math.round(wait * (0.8 + Math.random() * 0.4));
}

// Move to the next API key after the current one drains. Returns false when
// there's nothing left to fall back to. Every poll loop shares ytKeyIndex, so
// one loop hitting the limit switches all of them over at once.
function ytRotateKey(statusKey) {
  if (ytKeyIndex + 1 >= YT_KEYS.length) return false;
  ytKeyIndex++;
  const left = YT_KEYS.length - 1 - ytKeyIndex;
  console.warn("[merged-chat] YouTube key " + ytKeyIndex + " drained; switching to backup key " +
               ytKeyIndex + " of " + (YT_KEYS.length - 1) +
               (left ? " (" + left + " still in reserve)" : " (last one)"));
  status(statusKey, "YouTube: quota used up — switched to backup key " +
                    ytKeyIndex + "/" + (YT_KEYS.length - 1));
  return true;
}

// True if this error means "stop for good" — also latches the quota flag.
function ytIsFatal(err, statusKey) {
  const reason = ytErrorReason(err);
  if (YT_QUOTA_REASONS.has(reason)) {
    // Out of quota on this key. Fall back to the next one if we have it, and
    // only give up for the day once every key is drained.
    if (ytRotateKey(statusKey)) return false;
    ytQuotaExhausted = true;
    status(statusKey, YT_KEYS.length > 1
      ? "YouTube: all " + YT_KEYS.length + " API keys out of quota — resets at midnight US Pacific"
      : "YouTube: daily quota used up — resets at midnight US Pacific");
    console.warn("[merged-chat] YouTube quota exhausted on every key; stopping all polling. " +
                 "Raise YT_MIN_POLL_MS to make the daily quota last longer, " +
                 "or add another key to YT_API_KEY_BACKUP.");
    return true;
  }
  if (YT_FATAL_REASONS.has(reason)) {
    status(statusKey, "YouTube stopped: " + (err?.message || reason));
    return true;
  }
  return false;
}

async function startYouTubeVideo(videoId, statusKey) {
  if (ytQuotaExhausted) {   // don't spend the connect call on a drained key
    status(statusKey, "YouTube: daily quota used up — resets at midnight US Pacific");
    return;
  }
  reconnectStatus(statusKey, "YouTube: connecting…");
  try {
    const keyBefore = ytKeyIndex;
    const r = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${videoId}&key=${ytKey()}`
    );
    const d = await r.json();
    if (d.error) {
      if (ytIsFatal(d.error, statusKey)) return;
      // A quota error just rolled us onto a backup key — retry the connect on
      // it rather than dropping this video. Bounded: ytKeyIndex only ever
      // climbs, and it stops at the end of YT_KEYS.
      if (ytKeyIndex !== keyBefore) { startYouTubeVideo(videoId, statusKey); return; }
      status(statusKey, "YouTube: " + (d.error.message || "API error"));
      return;
    }

    const item = d.items?.[0];
    const chatId = item?.liveStreamingDetails?.activeLiveChatId;
    if (!chatId) { status(statusKey, "YouTube: no active live chat (is the stream live?)"); return; }

    const channel = item?.snippet?.channelTitle || "channel";
    reconnectStatus(statusKey, "YouTube: connected to " + channel);
    statusConnected[statusKey] = true;
    pollYouTube(chatId, "", statusKey);
  } catch (e) {
    status(statusKey, "YouTube error: " + e.message);
  }
}

// Render one liveChat item. Split out from the poll loop so relay mode can feed
// in items the relay fetched on its behalf — same rendering either way.
function addYouTubeItem(it) {
  const a = it.authorDetails || {};
  const sn = it.snippet || {};

  // Moderation, mirroring the Twitch CLEARMSG / CLEARCHAT handling above. These
  // only reach us when the poll is authorized as the owner or a moderator, so
  // with a plain API key they normally never arrive — handling them costs
  // nothing and stops a delete event rendering as an empty message if it does.
  if (sn.type === "messageDeletedEvent") {
    const id = (sn.messageDeletedDetails || {}).deletedMessageId;
    if (id) removeMessages(r => r.dataset.mid === id);
    return;
  }
  if (sn.type === "userBannedEvent") {
    const banned = ((sn.userBannedDetails || {}).bannedUserDetails || {}).channelId;
    if (banned) removeMessages(r => r.classList.contains("yt") && r.dataset.uid === banned);
    return;
  }

  addMessage({
    platform: "yt",
    name: a.displayName,
    color: colorFor(a.displayName),
    html: renderYouTube(sn.displayMessage || ""),
    owner: a.isChatOwner,
    mod: a.isChatModerator,
    member: a.isChatSponsor,
    msgId: it.id,
    userId: a.channelId,
  });
}

// Anything already in chat when the page loaded is backlog; anything posted
// after is live. A wall-clock cutoff survives reconnects, where the old
// "first poll" flag discarded a whole batch of *live* messages each time.
// The 1s margin keeps a message posted in the same second the page loaded on
// the live side of the line: a second of backlog is harmless, losing a real
// message is the whole bug.
const YT_START_MS = Date.now() - 1000;
const ytSeen = new Set();

// snippet.publishedAt -> epoch ms, or null when unreadable. Null means deliver
// anyway: dropping a message we merely failed to parse is the bug being fixed.
function ytPublishedMs(it) {
  const raw = ((it.snippet || {}).publishedAt || "").trim();
  if (!raw) return null;
  const t = Date.parse(raw);
  return Number.isNaN(t) ? null : t;
}

// Guards the one path that re-requests a page it already fetched: a key
// rotation re-polls the SAME pageToken, which would otherwise double-post.
function ytIsNew(it) {
  if (!it.id) return true;
  if (ytSeen.has(it.id)) return false;
  if (ytSeen.size >= 4000) ytSeen.clear();  // bounded; ids only need to stay fresh
  ytSeen.add(it.id);
  return true;
}

async function pollYouTube(chatId, pageToken, statusKey, fails = 0) {
  if (ytQuotaExhausted) return;   // another loop already drained this key

  try {
    const keyBefore = ytKeyIndex;
    const url =
      `https://www.googleapis.com/youtube/v3/liveChat/messages` +
      `?liveChatId=${chatId}&part=snippet,authorDetails&key=${ytKey()}` +
      (pageToken ? `&pageToken=${pageToken}` : "");

    const r = await fetch(url);
    const d = await r.json();
    if (d.error) {
      if (ytIsFatal(d.error, statusKey)) return;
      // Rolled onto a backup key — re-poll the SAME pageToken shortly, so the
      // switch costs no messages and doesn't go through the backoff path.
      if (ytKeyIndex !== keyBefore) {
        setTimeout(() => pollYouTube(chatId, pageToken, statusKey, 0), 1000);
        return;
      }
      // Anything else (rate limit, 5xx, unknown) goes to the backoff path.
      throw new Error(d.error.message || ytErrorReason(d.error) || "API error");
    }

    // Skip the backlog that existed when the page loaded (unless SHOW_BACKLOG
    // is on). Everything posted since is live — including the first batch
    // after a reconnect, which used to be thrown away.
    for (const it of d.items || []) {
      const ts = ytPublishedMs(it);
      if (!CONFIG.SHOW_BACKLOG && ts !== null && ts < YT_START_MS) continue;
      if (!ytIsNew(it)) continue;
      addYouTubeItem(it);
    }

    // Respect the API's suggested interval, but never faster than 2s, and never
    // faster than YT_MIN_POLL_MS (the quota saver — 15s by default).
    const floor = Math.max(CONFIG.YT_MIN_POLL_MS || 0, 2000);
    const wait = Math.max(d.pollingIntervalMillis || 5000, floor);
    setTimeout(() => pollYouTube(chatId, d.nextPageToken, statusKey, 0), wait);
  } catch (e) {
    // Transient failure: back off, and stop entirely once we've tried enough.
    const tries = fails + 1;
    const max   = CONFIG.YT_MAX_RETRIES ?? 6;   // missing from an older CONFIG block = use the default
    if (max > 0 && tries > max) {
      status(statusKey, `YouTube: gave up after ${max} failed polls (${e.message}) — reload to reconnect`);
      return;
    }
    const wait = ytBackoffMs(tries);
    reconnectStatus(statusKey, `YouTube: retrying in ${Math.round(wait / 1000)}s` +
                      (max > 0 ? ` (${tries}/${max})` : "") + ` — ${e.message}`);
    setTimeout(() => pollYouTube(chatId, pageToken, statusKey, tries), wait);
  }
}

/* ============================== GO =============================== */
if (IS_SETUP) {
  runRedeemSetup();               // ?setup: one-time flow to mint a refresh token
} else if (RELAY_URL) {
  // Preferred path: one relay process feeds every open page. Falls back to
  // running standalone if it isn't up, so the file still works on its own.
  status("relay", "Relay: connecting…");
  connectRelay(startDirect);
} else {
  startDirect();
}

// Do the network work in this page — the original behaviour, and what a page
// falls back to when there's no relay running.
function startDirect() {
  status("relay", "");
  connectTwitch();
  startYouTube();
  startTwitchRedeems();
}
</script>
